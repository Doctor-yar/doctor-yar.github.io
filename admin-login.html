<!DOCTYPE html><html lang="fa" dir="rtl"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>ورود مدیر | داکتر یار</title>  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Tahoma, Arial, sans-serif;
      background: linear-gradient(135deg, #e6fffb, #f3f8fa);
      color: #263238;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 30px 25px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.10);
      text-align: center;
    }

    .logo {
      width: 75px;
      height: 75px;
      margin: 0 auto 15px;
      border-radius: 50%;
      background: #e6fffb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
    }

    h1 {
      margin: 0 0 8px;
      color: #0d9488;
      font-size: 24px;
    }

    .subtitle {
      margin: 0 0 25px;
      color: #78909c;
      font-size: 14px;
    }

    .form-group {
      text-align: right;
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d7e2e5;
      border-radius: 12px;
      font-family: inherit;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #0d9488;
      box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.10);
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #0d9488;
      color: white;
      font-family: inherit;
      font-size: 16px;
      cursor: pointer;
      margin-top: 5px;
    }

    .login-btn:hover {
      background: #0f766e;
    }

    .error {
      display: none;
      background: #fee2e2;
      color: #b91c1c;
      padding: 11px;
      border-radius: 10px;
      margin-bottom: 15px;
      font-size: 13px;
    }

    .back {
      display: block;
      margin-top: 20px;
      color: #607d8b;
      text-decoration: none;
      font-size: 13px;
    }

    .back:hover {
      color: #0d9488;
    }
  </style></head><body>  <div class="login-box"><div class="logo">
  🩺
</div>

<h1>ورود مدیر</h1>

<p class="subtitle">
  پنل مدیریت داکتر یار
</p>

<div id="errorMessage" class="error">
  نام کاربری یا رمز عبور نادرست است.
</div>

<form onsubmit="adminLogin(event)">

  <div class="form-group">
    <label for="username">
      نام کاربری مدیر
    </label>

    <input
      type="text"
      id="username"
      placeholder="نام کاربری را وارد کنید"
      required
      autocomplete="username"
    >
  </div>

  <div class="form-group">
    <label for="password">
      رمز عبور
    </label>

    <input
      type="password"
      id="password"
      placeholder="رمز عبور را وارد کنید"
      required
      autocomplete="current-password"
    >
  </div>

  <button type="submit" class="login-btn">
    🔐 ورود به پنل مدیریت
  </button>

</form>

<a href="index.html" class="back">
  ← بازگشت به صفحه اصلی
</a>

  </div>  <script>

    function adminLogin(event) {

      event.preventDefault();

      const username =
        document.getElementById("username").value.trim();

      const password =
        document.getElementById("password").value;

      const errorMessage =
        document.getElementById("errorMessage");


      /*
        اطلاعات ورود مدیر
        فعلاً برای تست پروژه
      */

      const ADMIN_USERNAME = "admin";
      const ADMIN_PASSWORD = "123456";


      if (
        username === ADMIN_USERNAME &&
        password === ADMIN_PASSWORD
      ) {

        // ثبت ورود مدیر
        localStorage.setItem(
          "adminLoggedIn",
          "true"
        );

        // انتقال به پنل مدیریت
        window.location.href =
          "admin-dashboard.html";

      } else {

        errorMessage.style.display =
          "block";

      }

    }

  </script></body></html>
