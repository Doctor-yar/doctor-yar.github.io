<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>مدیریت مریضان | داکتر یار</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f4f7f9;
      color: #263238;
    }

    /* Header */

    .header {
      background: #0d9488;
      color: white;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }

    .header h1 {
      margin: 0;
      font-size: 21px;
    }

    .back {
      color: white;
      text-decoration: none;
      font-size: 14px;
    }

    /* Container */

    .container {
      max-width: 900px;
      margin: 25px auto;
      padding: 0 15px;
    }

    /* Title */

    .page-title {
      background: white;
      padding: 22px;
      border-radius: 16px;
      margin-bottom: 20px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.07);
    }

    .page-title h2 {
      margin: 0 0 8px;
      color: #0d9488;
    }

    .page-title p {
      margin: 0;
      color: #78909c;
      line-height: 1.8;
    }

    /* Statistics */

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }

    .stat {
      background: white;
      padding: 20px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 3px 10px rgba(0,0,0,0.07);
    }

    .stat-icon {
      font-size: 32px;
    }

    .stat-number {
      font-size: 26px;
      font-weight: bold;
      color: #0d9488;
      margin-top: 5px;
    }

    .stat-title {
      color: #78909c;
      margin-top: 5px;
      font-size: 14px;
    }

    /* Search */

    .search-box {
      background: white;
      padding: 18px;
      border-radius: 15px;
      margin-bottom: 20px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.07);
    }

    .search-box input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d9e3e5;
      border-radius: 10px;
      font-family: inherit;
      font-size: 15px;
      outline: none;
    }

    .search-box input:focus {
      border-color: #0d9488;
    }

    /* Patient Card */

    .patient-card {
      background: white;
      border-radius: 16px;
      margin-bottom: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.07);
      border: 1px solid #e6eeee;
      overflow: hidden;
    }

    .patient-main {
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 15px;
      cursor: pointer;
    }

    .patient-main:hover {
      background: #f8fffe;
    }

    .patient-icon {
      width: 58px;
      height: 58px;
      background: #e6fffb;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      flex-shrink: 0;
    }

    .patient-summary {
      flex: 1;
    }

    .patient-summary h3 {
      margin: 0 0 7px;
      font-size: 18px;
      color: #263238;
    }

    .patient-summary p {
      margin: 0;
      color: #607d8b;
      font-size: 14px;
      line-height: 1.7;
    }

    .patient-arrow {
      color: #0d9488;
      font-size: 25px;
    }

    /* Details */

    .patient-details {
      display: none;
      border-top: 1px solid #eeeeee;
      padding: 20px;
      background: #fbfdfd;
    }

    .patient-details.show {
      display: block;
    }

    .details-title {
      color: #0d9488;
      font-size: 18px;
      margin: 0 0 15px;
    }

    .details-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .detail-item {
      background: white;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid #edf1f2;
      line-height: 1.8;
      font-size: 14px;
    }

    .detail-item strong {
      display: block;
      color: #455a64;
      margin-bottom: 3px;
    }

    .description {
      grid-column: 1 / -1;
    }

    /* Actions */

    .patient-actions {
      margin-top: 18px;
      padding-top: 15px;
      border-top: 1px solid #eeeeee;
    }

    .delete-btn {
      border: none;
      background: #fee2e2;
      color: #dc2626;
      padding: 11px 18px;
      border-radius: 10px;
      font-family: inherit;
      cursor: pointer;
      font-size: 14px;
    }

    .delete-btn:hover {
      background: #fecaca;
    }

    /* Empty */

    .empty {
      background: white;
      padding: 45px 20px;
      border-radius: 16px;
      text-align: center;
      color: #78909c;
      box-shadow: 0 3px 10px rgba(0,0,0,0.07);
    }

    .empty-icon {
      font-size: 50px;
      margin-bottom: 10px;
    }

    /* Mobile */

    @media (max-width: 700px) {

      .header h1 {
        font-size: 17px;
      }

      .back {
        font-size: 12px;
      }

      .stats {
        grid-template-columns: 1fr 1fr;
      }

      .patient-main {
        padding: 16px;
      }

      .patient-icon {
        width: 50px;
        height: 50px;
        font-size: 26px;
      }

      .patient-summary h3 {
        font-size: 16px;
      }

      .details-grid {
        grid-template-columns: 1fr;
      }

      .description {
        grid-column: auto;
      }

    }

  </style>

</head>


<body>


<header class="header">

  <h1>
    👤 مدیریت مریضان
  </h1>

  <a
    href="admin-dashboard.html"
    class="back"
  >
    ← بازگشت به مدیریت
  </a>

</header>


<main class="container">


  <div class="page-title">

    <h2>
      👤 تمام مریضان
    </h2>

    <p>
      برای مشاهده مشخصات کامل هر مریض، روی نام او کلیک کنید.
    </p>

  </div>


  <!-- آمار -->

  <div class="stats">

    <div class="stat">

      <div class="stat-icon">
        👤
      </div>

      <div
        class="stat-number"
        id="totalPatients"
      >
        0
      </div>

      <div class="stat-title">
        تمام مریضان
      </div>

    </div>


    <div class="stat">

      <div class="stat-icon">
        🩺
      </div>

      <div
        class="stat-number"
        id="patientsWithReason"
      >
        0
      </div>

      <div class="stat-title">
        دارای علت مراجعه
      </div>

    </div>

  </div>


  <!-- جستجو -->

  <div class="search-box">

    <input
      type="text"
      id="searchInput"
      placeholder="🔎 جستجوی نام مریض یا علت بیماری..."
      oninput="showPatients()"
    >

  </div>


  <!-- لیست مریضان -->

  <div id="patientsList"></div>


</main>


<script>


/* =====================================
   بررسی ورود مدیر
===================================== */

if (
  localStorage.getItem("adminLoggedIn") !== "true"
) {

  window.location.replace(
    "admin-login.html"
  );

}


/* =====================================
   دریافت مریضان
===================================== */

let patients =
  JSON.parse(
    localStorage.getItem("patients") || "[]"
  );


/* =====================================
   گرفتن مقدار از چند نام احتمالی
===================================== */

function getValue(item, names) {

  for (let name of names) {

    if (
      item[name] !== undefined &&
      item[name] !== null &&
      item[name] !== ""
    ) {

      return item[name];

    }

  }

  return "ثبت نشده";

}


/* =====================================
   نمایش مریضان
===================================== */

function showPatients() {

  const list =
    document.getElementById(
      "patientsList"
    );


  const search =
    document.getElementById(
      "searchInput"
    ).value
    .trim()
    .toLowerCase();


  const filtered =
    patients.filter(
      function(patient) {

        const name =
          getValue(
            patient,
            [
              "name",
              "fullName",
              "patientName",
              "firstName"
            ]
          );


        const reason =
          getValue(
            patient,
            [
              "reason",
              "illness",
              "disease",
              "medicalReason",
              "visitReason",
              "complaint"
            ]
          );


        const text =
          (
            name +
            " " +
            reason
          ).toLowerCase();


        return text.includes(search);

      }
    );


  updateStatistics();


  if (
    filtered.length === 0
  ) {

    list.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          👤
        </div>

        <h3>
          مریضی پیدا نشد
        </h3>

        <p>
          هنوز مریضی ثبت نشده است یا مورد جستجو پیدا نشد.
        </p>

      </div>

    `;

    return;

  }


  list.innerHTML = "";


  filtered.forEach(
    function(patient) {

      const realIndex =
        patients.indexOf(patient);


      const name =
        getValue(
          patient,
          [
            "name",
            "fullName",
            "patientName",
            "firstName"
          ]
        );


      const reason =
        getValue(
          patient,
          [
            "reason",
            "illness",
            "disease",
            "medicalReason",
            "visitReason",
            "complaint"
          ]
        );


      list.innerHTML += `

        <div class="patient-card">


          <!-- قسمت قابل کلیک -->

          <div
            class="patient-main"
            onclick="toggleDetails(${realIndex})"
          >

            <div class="patient-icon">
              👤
            </div>


            <div class="patient-summary">

              <h3>
                ${escapeHTML(name)}
              </h3>

              <p>
                🩺 علت مراجعه:
                ${escapeHTML(reason)}
              </p>

            </div>


            <div
              class="patient-arrow"
              id="arrow-${realIndex}"
            >
              ‹
            </div>

          </div>


          <!-- مشخصات کامل -->

          <div
            class="patient-details"
            id="details-${realIndex}"
          >

            <h3 class="details-title">
              📋 مشخصات کامل مریض
            </h3>


            <div class="details-grid">


              <div class="detail-item">

                <strong>
                  👤 نام و نام خانوادگی
                </strong>

                ${escapeHTML(
                  getValue(patient, [
                    "name",
                    "fullName",
                    "patientName"
                  ])
                )}

              </div>


              <div class="detail-item">

                <strong>
                  📞 شماره تماس
                </strong>

                ${escapeHTML(
                  getValue(patient, [
                    "phone",
                    "mobile",
                    "phoneNumber",
                    "patientPhone"
                  ])
                )}

              </div>


              <div class="detail-item">

                <strong>
                  📧 ایمیل
                </strong>

                ${escapeHTML(
                  getValue(patient, [
                    "email",
                    "patientEmail"
                  ])
                )}

              </div>


              <div class="detail-item">

                <strong>
                  🎂 سن
                </strong>

                ${escapeHTML(
                  getValue(patient, [
                    "age",
                    "patientAge"
                  ])
                )}

              </div>


              <div class="detail-item">

                <strong>
                  🎂 تاریخ تولد
                </strong>

                ${escapeHTML(
                  getValue(patient, [
                    "birthDate",
                    "dateOfBirth",
                    "dob"
                  ])
                )}

              </div>


              <div class="detail-item">

                <strong>
                  🏙️ شهر
                </strong>

                ${escapeHTML(
                  getValue(patient, [
                    "city",
                    "location",
                    "patientCity"
                  ])
                )}

              </div>


              <div class="detail-item">

                <strong>
                  🩺 علت بیماری / مراجعه
                </strong>

                ${escapeHTML(
                  getValue(patient, [
                    "reason",
                    "illness",
                    "disease",
                    "medicalReason",
                    "visitReason",
                    "complaint"
                  ])
                )}

              </div>


              <div class="detail-item">

                <strong>
                  🚻 جنسیت
                </strong>

                ${escapeHTML(
                  getValue(patient, [
                    "gender",
                    "sex"
                  ])
                )}

              </div>


              <div class="detail-item description">

                <strong>
                  📝 توضیحات
                </strong>

                ${escapeHTML(
                  getValue(patient, [
                    "description",
                    "notes",
                    "medicalNotes",
                    "message"
                  ])
                )}

              </div>


            </div>


            <div class="patient-actions">

              <button
                class="delete-btn"
                onclick="deletePatient(${realIndex})"
              >
                🗑️ حذف حساب مریض
              </button>

            </div>


          </div>


        </div>

      `;

    }
  );

}


/* =====================================
   باز و بسته کردن مشخصات
===================================== */

function toggleDetails(index) {

  const details =
    document.getElementById(
      "details-" + index
    );


  const arrow =
    document.getElementById(
      "arrow-" + index
    );


  if (
    details.classList.contains("show")
  ) {

    details.classList.remove("show");

    arrow.textContent = "‹";

  } else {

    details.classList.add("show");

    arrow.textContent = "⌄";

  }

}


/* =====================================
   آمار
===================================== */

function updateStatistics() {

  document.getElementById(
    "totalPatients"
  ).textContent =
    patients.length;


  const withReason =
    patients.filter(
      function(patient) {

        const reason =
          getValue(
            patient,
            [
              "reason",
              "illness",
              "disease",
              "medicalReason",
              "visitReason",
              "complaint"
            ]
          );

        return reason !== "ثبت نشده";

      }
    ).length;


  document.getElementById(
    "patientsWithReason"
  ).textContent =
    withReason;

}


/* =====================================
   حذف مریض
===================================== */

function deletePatient(index) {

  const patient =
    patients[index];


  const name =
    getValue(
      patient,
      [
        "name",
        "fullName",
        "patientName"
      ]
    );


  const ok =
    confirm(
      "آیا مطمئن هستید که می‌خواهید حساب «" +
      name +
      "» را حذف کنید؟"
    );


  if (!ok) {
    return;
  }


  patients.splice(
    index,
    1
  );


  localStorage.setItem(
    "patients",
    JSON.stringify(patients)
  );


  showPatients();

}


/* =====================================
   جلوگیری از HTML ناخواسته
===================================== */

function escapeHTML(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =====================================
   شروع
===================================== */

showPatients();


</script>


</body>

</html>
