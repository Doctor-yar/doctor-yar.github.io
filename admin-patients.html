<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>مدیریت مریضان | داکتر یار</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f4f7f9;
      color: #263238;
    }

    /* Header */

    .header {
      background: #0d9488;
      color: white;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }

    .header h1 {
      margin: 0;
      font-size: 21px;
    }

    .back {
      color: white;
      text-decoration: none;
      font-size: 14px;
    }

    /* Container */

    .container {
      max-width: 1000px;
      margin: 25px auto;
      padding: 0 15px;
    }

    /* Title */

    .page-title {
      background: white;
      padding: 22px;
      border-radius: 16px;
      margin-bottom: 20px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.07);
    }

    .page-title h2 {
      margin: 0 0 8px;
      color: #0d9488;
      font-size: 21px;
    }

    .page-title p {
      margin: 0;
      color: #78909c;
      line-height: 1.8;
      font-size: 14px;
    }

    /* سه گزینه */

    .menu {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }

    .menu-btn {
      background: white;
      border: 2px solid transparent;
      border-radius: 16px;
      padding: 22px 15px;
      text-align: center;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(0,0,0,0.07);
      transition: 0.2s;
    }

    .menu-btn:hover {
      transform: translateY(-2px);
      border-color: #0d9488;
    }

    .menu-btn.active {
      border-color: #0d9488;
      background: #e6fffb;
    }

    .menu-icon {
      font-size: 34px;
      margin-bottom: 8px;
    }

    .menu-title {
      font-size: 16px;
      font-weight: bold;
      color: #263238;
    }

    .menu-count {
      margin-top: 6px;
      color: #78909c;
      font-size: 13px;
    }

    /* Search */

    .search-box {
      background: white;
      padding: 17px;
      border-radius: 15px;
      margin-bottom: 20px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.07);
    }

    .search-box input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d9e3e5;
      border-radius: 10px;
      font-family: inherit;
      font-size: 15px;
      outline: none;
    }

    .search-box input:focus {
      border-color: #0d9488;
    }

    /* List */

    #patientsList {
      margin-bottom: 20px;
    }

    .patient-card {
      background: white;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 13px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.07);
      border: 1px solid #e6eeee;
      cursor: pointer;
      transition: 0.2s;
    }

    .patient-card:hover {
      transform: translateY(-2px);
      border-color: #0d9488;
      box-shadow: 0 6px 15px rgba(0,0,0,0.10);
    }

    .patient-row {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .patient-icon {
      width: 55px;
      height: 55px;
      border-radius: 14px;
      background: #e6fffb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      flex-shrink: 0;
    }

    .patient-info {
      flex: 1;
    }

    .patient-name {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 6px;
      color: #263238;
    }

    .patient-illness {
      color: #607d8b;
      font-size: 13px;
    }

    .patient-arrow {
      color: #0d9488;
      font-size: 24px;
    }

    /* Status */

    .patient-status {
      display: inline-block;
      margin-top: 9px;
      padding: 5px 10px;
      border-radius: 15px;
      font-size: 11px;
    }

    .status-confirmed {
      background: #dcfce7;
      color: #15803d;
    }

    .status-pending {
      background: #fef3c7;
      color: #b45309;
    }

    .status-none {
      background: #e2e8f0;
      color: #475569;
    }

    /* Empty */

    .empty {
      background: white;
      padding: 45px 20px;
      border-radius: 16px;
      text-align: center;
      color: #78909c;
      box-shadow: 0 3px 10px rgba(0,0,0,0.07);
    }

    .empty-icon {
      font-size: 50px;
      margin-bottom: 10px;
    }

    /* Modal */

    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      inset: 0;
      background: rgba(0,0,0,0.55);
      padding: 20px;
      overflow-y: auto;
    }

    .modal.show {
      display: block;
    }

    .modal-box {
      background: white;
      max-width: 700px;
      margin: 30px auto;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 35px rgba(0,0,0,0.20);
    }

    .modal-header {
      background: #0d9488;
      color: white;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 19px;
    }

    .close-btn {
      background: transparent;
      color: white;
      font-size: 28px;
      padding: 0;
      margin: 0;
    }

    .modal-content {
      padding: 20px;
    }

    .profile-top {
      text-align: center;
      padding: 10px 0 20px;
      border-bottom: 1px solid #eee;
      margin-bottom: 18px;
    }

    .profile-icon {
      width: 75px;
      height: 75px;
      margin: auto;
      border-radius: 20px;
      background: #e6fffb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
    }

    .profile-top h3 {
      margin: 12px 0 5px;
      color: #263238;
    }

    .profile-top p {
      margin: 0;
      color: #78909c;
      font-size: 13px;
    }

    .details {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 11px;
    }

    .detail {
      background: #f8fafb;
      border-radius: 11px;
      padding: 13px;
      line-height: 1.8;
      font-size: 13px;
    }

    .detail strong {
      display: block;
      color: #455a64;
      margin-bottom: 2px;
    }

    .disease-box {
      grid-column: 1 / -1;
    }

    .appointment-box {
      margin-top: 18px;
      background: #f8fafb;
      padding: 15px;
      border-radius: 12px;
    }

    .appointment-box h3 {
      margin: 0 0 10px;
      color: #0d9488;
      font-size: 16px;
    }

    .close-bottom {
      width: 100%;
      background: #0d9488;
      color: white;
      margin-top: 20px;
      padding: 14px;
      font-size: 15px;
    }

    /* Mobile */

    @media (max-width: 700px) {

      .header h1 {
        font-size: 17px;
      }

      .back {
        font-size: 12px;
      }

      .menu {
        grid-template-columns: 1fr;
      }

      .menu-btn {
        display: flex;
        align-items: center;
        text-align: right;
        gap: 13px;
        padding: 16px;
      }

      .menu-icon {
        margin: 0;
        font-size: 30px;
      }

      .menu-count {
        margin-right: auto;
      }

      .details {
        grid-template-columns: 1fr;
      }

      .disease-box {
        grid-column: auto;
      }

    }

  </style>

</head>


<body>


<header class="header">

  <h1>
    👥 مدیریت مریضان
  </h1>

  <a
    href="admin-dashboard.html"
    class="back"
  >
    ← بازگشت به مدیریت
  </a>

</header>


<main class="container">


  <div class="page-title">

    <h2>
      👥 مدیریت مریضان داکتر یار
    </h2>

    <p>
      مریضان را بر اساس وضعیت نوبت مشاهده کنید.
      برای دیدن تمام مشخصات، روی نام مریض کلیک کنید.
    </p>

  </div>


  <!-- سه گزینه -->

  <div class="menu">


    <button
      class="menu-btn active"
      id="allBtn"
      onclick="changeCategory('all')"
    >

      <div class="menu-icon">
        👥
      </div>

      <div>

        <div class="menu-title">
          تمام مریضان
        </div>

        <div
          class="menu-count"
          id="allCount"
        >
          0 مریض
        </div>

      </div>

    </button>


    <button
      class="menu-btn"
      id="confirmedBtn"
      onclick="changeCategory('confirmed')"
    >

      <div class="menu-icon">
        ✅
      </div>

      <div>

        <div class="menu-title">
          تأیید شده
        </div>

        <div
          class="menu-count"
          id="confirmedCount"
        >
          0 مریض
        </div>

      </div>

    </button>


    <button
      class="menu-btn"
      id="pendingBtn"
      onclick="changeCategory('pending')"
    >

      <div class="menu-icon">
        ⏳
      </div>

      <div>

        <div class="menu-title">
          در انتظار
        </div>

        <div
          class="menu-count"
          id="pendingCount"
        >
          0 مریض
        </div>

      </div>

    </button>


  </div>


  <!-- جستجو -->

  <div class="search-box">

    <input
      type="text"
      id="searchInput"
      placeholder="🔎 جستجوی نام مریض یا علت بیماری..."
      oninput="showPatients()"
    >

  </div>


  <!-- لیست -->

  <div id="patientsList"></div>


</main>


<!-- مشخصات کامل مریض -->

<div
  class="modal"
  id="patientModal"
  onclick="closeModalOutside(event)"
>


  <div
    class="modal-box"
    onclick="event.stopPropagation()"
  >


    <div class="modal-header">

      <h2>
        👤 مشخصات کامل مریض
      </h2>

      <button
        class="close-btn"
        onclick="closeModal()"
      >
        ×
      </button>

    </div>


    <div
      class="modal-content"
      id="patientDetails"
    ></div>


  </div>

</div>


<script>

/* =====================================
   بررسی ورود مدیر
===================================== */

if (
  localStorage.getItem("adminLoggedIn") !== "true"
) {

  window.location.replace(
    "admin-login.html"
  );

}


/* =====================================
   دریافت اطلاعات
===================================== */

let patients =
  JSON.parse(
    localStorage.getItem("patients") || "[]"
  );


let appointments =
  JSON.parse(
    localStorage.getItem("appointments") || "[]"
  );


let currentCategory = "all";


/* =====================================
   پیدا کردن مقدار
===================================== */

function getValue(item, names) {

  for (let name of names) {

    if (
      item &&
      item[name] !== undefined &&
      item[name] !== null &&
      item[name] !== ""
    ) {

      return item[name];

    }

  }

  return "ثبت نشده";

}


/* =====================================
   نام مریض
===================================== */

function getPatientName(patient) {

  return getValue(
    patient,
    [
      "fullName",
      "patientName",
      "name",
      "patientFullName",
      "username"
    ]
  );

}


/* =====================================
   علت بیماری
===================================== */

function getDisease(patient) {

  return getValue(
    patient,
    [
      "disease",
      "illness",
      "reason",
      "medicalProblem",
      "problem",
      "diseaseReason",
      "complaint"
    ]
  );

}


/* =====================================
   پیدا کردن نوبت مریض
===================================== */

function getPatientAppointments(patient) {

  const patientName =
    getPatientName(patient);

  const patientPhone =
    getValue(
      patient,
      [
        "phone",
        "mobile",
        "patientPhone",
        "phoneNumber"
      ]
    );

  return appointments.filter(
    function(appointment) {

      const appointmentPatientName =
        getValue(
          appointment,
          [
            "patientName",
            "patientFullName",
            "patient",
            "name"
          ]
        );

      const appointmentPhone =
        getValue(
          appointment,
          [
            "patientPhone",
            "phone",
            "mobile",
            "phoneNumber"
          ]
        );

      if (
        patientPhone !== "ثبت نشده" &&
        appointmentPhone !== "ثبت نشده"
      ) {

        return String(patientPhone) ===
               String(appointmentPhone);

      }

      return String(appointmentPatientName)
        .trim()
        .toLowerCase() ===
        String(patientName)
        .trim()
        .toLowerCase();

    }
  );

}


/* =====================================
   وضعیت نوبت
===================================== */

function getAppointmentStatus(appointment) {

  const status =
    getValue(
      appointment,
      [
        "status",
        "appointmentStatus"
      ]
    );


  if (
    status === "confirmed" ||
    status === "تأیید شده"
  ) {

    return "confirmed";

  }


  if (
    status === "cancelled" ||
    status === "canceled" ||
    status === "لغو شده"
  ) {

    return "cancelled";

  }


  if (
    status === "completed" ||
    status === "تکمیل شده"
  ) {

    return "completed";

  }


  return "pending";

}


/* =====================================
   وضعیت مریض برای سه بخش
===================================== */

function getPatientStatus(patient) {

  const patientAppointments =
    getPatientAppointments(patient);


  if (
    patientAppointments.length === 0
  ) {

    return "none";

  }


  const hasConfirmed =
    patientAppointments.some(
      function(item) {

        return getAppointmentStatus(item)
          === "confirmed";

      }
    );


  if (hasConfirmed) {

    return "confirmed";

  }


  const hasPending =
    patientAppointments.some(
      function(item) {

        return getAppointmentStatus(item)
          === "pending";

      }
    );


  if (hasPending) {

    return "pending";

  }


  return "none";

}


/* =====================================
   متن وضعیت
===================================== */

function getStatusText(status) {

  if (status === "confirmed") {

    return "✅ نوبت تأیید شده";

  }

  if (status === "pending") {

    return "⏳ نوبت در انتظار";

  }

  return "ℹ️ بدون نوبت فعال";

}


/* =====================================
   تغییر دسته
===================================== */

function changeCategory(category) {

  currentCategory =
    category;


  document
    .getElementById("allBtn")
    .classList.remove("active");

  document
    .getElementById("confirmedBtn")
    .classList.remove("active");

  document
    .getElementById("pendingBtn")
    .classList.remove("active");


  if (category === "all") {

    document
      .getElementById("allBtn")
      .classList.add("active");

  }


  if (category === "confirmed") {

    document
      .getElementById("confirmedBtn")
      .classList.add("active");

  }


  if (category === "pending") {

    document
      .getElementById("pendingBtn")
      .classList.add("active");

  }


  showPatients();

}


/* =====================================
   نمایش مریضان
===================================== */

function showPatients() {

  const list =
    document.getElementById(
      "patientsList"
    );


  const search =
    document
      .getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();


  updateCounts();


  const filtered =
    patients.filter(
      function(patient) {

        const name =
          getPatientName(patient);

        const disease =
          getDisease(patient);

        const status =
          getPatientStatus(patient);


        const text =
          (
            name +
            " " +
            disease
          ).toLowerCase();


        const searchMatch =
          text.includes(search);


        let categoryMatch =
          true;


        if (
          currentCategory === "confirmed"
        ) {

          categoryMatch =
            status === "confirmed";

        }


        if (
          currentCategory === "pending"
        ) {

          categoryMatch =
            status === "pending";

        }


        return (
          searchMatch &&
          categoryMatch
        );

      }
    );


  if (
    filtered.length === 0
  ) {

    list.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          👤
        </div>

        <h3>
          مریضی پیدا نشد
        </h3>

        <p>
          در این بخش فعلاً مریضی موجود نیست.
        </p>

      </div>

    `;

    return;

  }


  list.innerHTML = "";


  filtered.forEach(
    function(patient) {

      const name =
        getPatientName(patient);

      const disease =
        getDisease(patient);

      const status =
        getPatientStatus(patient);

      const statusText =
        getStatusText(status);


      const index =
        patients.indexOf(patient);


      list.innerHTML += `

        <div
          class="patient-card"
          onclick="showPatientDetails(${index})"
        >

          <div class="patient-row">

            <div class="patient-icon">
              👤
            </div>

            <div class="patient-info">

              <div class="patient-name">
                ${escapeHTML(name)}
              </div>

              <div class="patient-illness">
                🩺 علت بیماری:
                ${escapeHTML(disease)}
              </div>

              <span
                class="patient-status ${
                  status === "confirmed"
                  ? "status-confirmed"
                  : status === "pending"
                  ? "status-pending"
                  : "status-none"
                }"
              >
                ${statusText}
              </span>

            </div>

            <div class="patient-arrow">
              ‹
            </div>

          </div>

        </div>

      `;

    }
  );

}


/* =====================================
   شمارش
===================================== */

function updateCounts() {

  let confirmed = 0;
  let pending = 0;


  patients.forEach(
    function(patient) {

      const status =
        getPatientStatus(patient);


      if (
        status === "confirmed"
      ) {

        confirmed++;

      }


      if (
        status === "pending"
      ) {

        pending++;

      }

    }
  );


  document.getElementById(
    "allCount"
  ).textContent =
    patients.length + " مریض";


  document.getElementById(
    "confirmedCount"
  ).textContent =
    confirmed + " مریض";


  document.getElementById(
    "pendingCount"
  ).textContent =
    pending + " مریض";

}


/* =====================================
   نمایش مشخصات کامل
===================================== */

function showPatientDetails(index) {

  const patient =
    patients[index];


  if (!patient) {
    return;
  }


  const name =
    getPatientName(patient);

  const disease =
    getDisease(patient);

  const phone =
    getValue(
      patient,
      [
        "phone",
        "mobile",
        "phoneNumber",
        "patientPhone"
      ]
    );

  const age =
    getValue(
      patient,
      [
        "age",
        "patientAge"
      ]
    );

  const gender =
    getValue(
      patient,
      [
        "gender",
        "sex"
      ]
    );

  const address =
    getValue(
      patient,
      [
        "address",
        "location",
        "city"
      ]
    );

  const email =
    getValue(
      patient,
      [
        "email",
        "emailAddress"
      ]
    );

  const username =
    getValue(
      patient,
      [
        "username",
        "userName"
      ]
    );

  const description =
    getValue(
      patient,
      [
        "description",
        "diseaseDescription",
        "medicalHistory",
        "details",
        "message"
      ]
    );

  const registerDate =
    getValue(
      patient,
      [
        "createdAt",
        "registerDate",
        "date",
        "createdDate"
      ]
    );


  const status =
    getPatientStatus(patient);


  const statusText =
    getStatusText(status);


  const patientAppointments =
    getPatientAppointments(patient);


  let appointmentHTML = "";


  if (
    patientAppointments.length > 0
  ) {

    appointmentHTML = `

      <div class="appointment-box">

        <h3>
          📅 معلومات نوبت
        </h3>

        ${
          patientAppointments
            .map(
              function(item) {

                const doctor =
                  getValue(
                    item,
                    [
                      "doctorName",
                      "doctor",
                      "doctorFullName"
                    ]
                  );

                const date =
                  getValue(
                    item,
                    [
                      "date",
                      "appointmentDate",
                      "day"
                    ]
                  );

                const time =
                  getValue(
                    item,
                    [
                      "time",
                      "appointmentTime"
                    ]
                  );

                const type =
                  getValue(
                    item,
                    [
                      "visitType",
                      "appointmentType",
                      "type"
                    ]
                  );

                const appointmentStatus =
                  getAppointmentStatus(item);


                return `

                  <div
                    class="detail"
                    style="margin-top:10px;"
                  >

                    <strong>
                      👨‍⚕️ داکتر
                    </strong>

                    ${escapeHTML(doctor)}

                    <strong style="margin-top:7px;">
                      📅 تاریخ
                    </strong>

                    ${escapeHTML(date)}

                    <strong style="margin-top:7px;">
                      ⏰ ساعت
                    </strong>

                    ${escapeHTML(time)}

                    <strong style="margin-top:7px;">
                      🩺 نوع ویزیت
                    </strong>

                    ${escapeHTML(type)}

                    <strong style="margin-top:7px;">
                      📌 وضعیت
                    </strong>

                    ${escapeHTML(
                      getStatusText(appointmentStatus)
                    )}

                  </div>

                `;

              }
            )
            .join("")
        }

      </div>

    `;

  }


  document.getElementById(
    "patientDetails"
  ).innerHTML = `

    <div class="profile-top">

      <div class="profile-icon">
        👤
      </div>

      <h3>
        ${escapeHTML(name)}
      </h3>

      <p>
        ${escapeHTML(statusText)}
      </p>

    </div>


    <div class="details">

      <div class="detail">

        <strong>
          👤 نام مریض
        </strong>

        ${escapeHTML(name)}

      </div>


      <div class="detail">

        <strong>
          🩺 علت بیماری
        </strong>

/* =====================================
   بستن مشخصات
===================================== */

function closeModal() {

  document
    .getElementById("patientModal")
    .classList.remove("show");

}


function closeModalOutside(event) {

  if (
    event.target.id === "patientModal"
  ) {

    closeModal();

  }

}


/* =====================================
   جلوگیری از HTML
===================================== */

function escapeHTML(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}
