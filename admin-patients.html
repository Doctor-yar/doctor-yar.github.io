<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>مدیریت مریضان | داکتر یار</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f4f7f9;
      color: #263238;
    }

    .header {
      background: #0d9488;
      color: white;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }

    .header h1 {
      margin: 0;
      font-size: 21px;
    }

    .back {
      color: white;
      text-decoration: none;
      font-size: 14px;
    }

    .container {
      max-width: 1100px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .page-title {
      background: white;
      padding: 22px;
      border-radius: 16px;
      margin-bottom: 20px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.07);
    }

    .page-title h2 {
      margin: 0 0 8px;
      color: #0d9488;
    }

    .page-title p {
      margin: 0;
      color: #78909c;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }

    .stat {
      background: white;
      padding: 20px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 3px 10px rgba(0,0,0,0.07);
    }

    .stat-icon {
      font-size: 32px;
    }

    .stat-number {
      font-size: 27px;
      font-weight: bold;
      color: #0d9488;
      margin-top: 5px;
    }

    .stat-title {
      color: #78909c;
      margin-top: 5px;
      font-size: 14px;
    }

    .search-box {
      background: white;
      padding: 18px;
      border-radius: 15px;
      margin-bottom: 20px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.07);
    }

    .search-box input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d9e3e5;
      border-radius: 10px;
      font-family: inherit;
      font-size: 15px;
      outline: none;
    }

    .search-box input:focus {
      border-color: #0d9488;
    }

    .patient-card {
      background: white;
      border-radius: 17px;
      margin-bottom: 18px;
      padding: 22px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.07);
      border: 1px solid #e6eeee;
    }

    .patient-top {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 18px;
    }

    .patient-avatar {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: #e6fffb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      flex-shrink: 0;
    }

    .patient-name h3 {
      margin: 0 0 6px;
      font-size: 19px;
    }

    .patient-name p {
      margin: 0;
      color: #607d8b;
      font-size: 14px;
    }

    .patient-info {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      border-top: 1px solid #eee;
      padding-top: 15px;
    }

    .info-item {
      background: #f8fafb;
      padding: 11px;
      border-radius: 10px;
      font-size: 13px;
    }

    .info-item strong {
      color: #455a64;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 18px;
      border-top: 1px solid #eee;
      padding-top: 15px;
    }

    button {
      border: none;
      padding: 11px 15px;
      border-radius: 10px;
      font-family: inherit;
      cursor: pointer;
      font-size: 13px;
    }

    .edit-btn {
      background: #e2e8f0;
      color: #334155;
    }

    .delete-btn {
      background: #fee2e2;
      color: #dc2626;
    }

    .delete-btn:hover {
      background: #fecaca;
    }

    .empty {
      background: white;
      padding: 40px 20px;
      border-radius: 16px;
      text-align: center;
      color: #78909c;
      box-shadow: 0 3px 10px rgba(0,0,0,0.07);
    }

    .empty-icon {
      font-size: 45px;
      margin-bottom: 10px;
    }

    @media (max-width: 700px) {

      .header h1 {
        font-size: 17px;
      }

      .back {
        font-size: 12px;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .patient-info {
        grid-template-columns: 1fr;
      }

      .patient-top {
        align-items: flex-start;
      }

      .actions button {
        flex: 1;
      }

    }

  </style>

</head>


<body>


<header class="header">

  <h1>
    🩺 مدیریت مریضان
  </h1>

  <a
    href="admin-dashboard.html"
    class="back"
  >
    ← بازگشت به مدیریت
  </a>

</header>


<main class="container">


  <div class="page-title">

    <h2>
      👤 مریضان داکتر یار
    </h2>

    <p>
      تمام مریضانی که در سایت ثبت‌نام کرده‌اند در اینجا نمایش داده می‌شوند.
    </p>

  </div>


  <!-- آمار -->

  <div class="stats">

    <div class="stat">

      <div class="stat-icon">
        👤
      </div>

      <div
        class="stat-number"
        id="totalPatients"
      >
        0
      </div>

      <div class="stat-title">
        تمام مریضان
      </div>

    </div>


    <div class="stat">

      <div class="stat-icon">
        📅
      </div>

      <div
        class="stat-number"
        id="totalAppointments"
      >
        0
      </div>

      <div class="stat-title">
        نوبت‌های مریضان
      </div>

    </div>

  </div>


  <!-- جستجو -->

  <div class="search-box">

    <input
      type="text"
      id="searchInput"
      placeholder="🔎 جستجوی مریض بر اساس نام، شماره یا شهر..."
      oninput="showPatients()"
    >

  </div>


  <!-- لیست مریضان -->

  <div id="patientsList"></div>


</main>


<script>


/* =====================================
   بررسی ورود مدیر
===================================== */

if (
  localStorage.getItem("adminLoggedIn") !== "true"
) {

  window.location.replace(
    "admin-login.html"
  );

}


/* =====================================
   دریافت مریضان
===================================== */

let patients =
  JSON.parse(
    localStorage.getItem("patients") || "[]"
  );


/* =====================================
   دریافت نوبت‌ها
===================================== */

let appointments =
  JSON.parse(
    localStorage.getItem("appointments") || "[]"
  );


/* =====================================
   تابع دریافت اطلاعات
===================================== */

function getValue(patient, names) {

  for (let name of names) {

    if (
      patient[name] !== undefined &&
      patient[name] !== null &&
      patient[name] !== ""
    ) {

      return patient[name];

    }

  }

  return "ثبت نشده";

}


/* =====================================
   نمایش مریضان
===================================== */

function showPatients() {

  const list =
    document.getElementById(
      "patientsList"
    );


  const search =
    document.getElementById(
      "searchInput"
    ).value
    .trim()
    .toLowerCase();


  const filtered =
    patients.filter(function(patient) {


      const name =
        getValue(
          patient,
          [
            "name",
            "fullName",
            "patientName",
            "fullname"
          ]
        );


      const phone =
        getValue(
          patient,
          [
            "phone",
            "mobile",
            "phoneNumber",
            "contact"
          ]
        );


      const city =
        getValue(
          patient,
          [
            "city",
            "location"
          ]
        );


      const text =
        (
          name +
          " " +
          phone +
          " " +
          city
        ).toLowerCase();


      return text.includes(search);

    });


  updateStatistics();


  if (filtered.length === 0) {

    list.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          👤
        </div>

        <h3>
          هنوز مریضی ثبت‌نام نکرده است
        </h3>

        <p>
          وقتی یک مریض در سایت ثبت‌نام کند،
          معلومات او در اینجا نمایش داده می‌شود.
        </p>

      </div>

    `;

    return;

  }


  list.innerHTML = "";


  filtered.forEach(function(patient) {


    const realIndex =
      patients.indexOf(patient);


    const name =
      getValue(
        patient,
        [
          "name",
          "fullName",
          "patientName",
          "fullname"
        ]
      );


    const phone =
      getValue(
        patient,
        [
          "phone",
          "mobile",
          "phoneNumber",
          "contact"
        ]
      );


    const city =
      getValue(
        patient,
        [
          "city",
          "location"
        ]
      );


    const age =
      getValue(
        patient,
        [
          "age"
        ]
      );


    const gender =
      getValue(
        patient,
        [
          "gender",
          "sex"
        ]
      );


    const email =
      getValue(
        patient,
        [
          "email",
          "emailAddress"
        ]
      );


    list.innerHTML += `

      <div class="patient-card">


        <div class="patient-top">

          <div class="patient-avatar">
            👤
          </div>


          <div class="patient-name">

            <h3>
              ${escapeHTML(name)}
            </h3>

            <p>
              👤 حساب مریض
            </p>

          </div>

        </div>


        <div class="patient-info">


          <div class="info-item">

            <strong>
              📞 شماره تماس:
            </strong>

            ${escapeHTML(phone)}

          </div>


          <div class="info-item">

            <strong>
              📍 شهر:
            </strong>

            ${escapeHTML(city)}

          </div>


          <div class="info-item">

            <strong>
              🎂 سن:
            </strong>

            ${escapeHTML(age)}

          </div>


          <div class="info-item">

            <strong>
              ⚥ جنسیت:
            </strong>

            ${escapeHTML(gender)}

          </div>


          <div class="info-item">

            <strong>
              📧 ایمیل:
            </strong>

            ${escapeHTML(email)}

          </div>


        </div>


        <div class="actions">


          <button
            class="edit-btn"
            onclick="editPatient(${realIndex})"
          >
            ✏️ ویرایش
          </button>


          <button
            class="delete-btn"
            onclick="deletePatient(${realIndex})"
          >
            🗑️ حذف
          </button>


        </div>


      </div>

    `;

  });

}


/* =====================================
   آمار
===================================== */

function updateStatistics() {

  document.getElementById(
    "totalPatients"
  ).textContent =
    patients.length;


  document.getElementById(
    "totalAppointments"
  ).textContent =
    appointments.length;

}


/* =====================================
   حذف مریض
===================================== */

function deletePatient(index) {


  const patient =
    patients[index];


  const name =
    getValue(
      patient,
      [
        "name",
        "fullName",
        "patientName",
        "fullname"
      ]
    );


  const confirmDelete =
    confirm(
      "آیا مطمئن هستید که می‌خواهید مریض «" +
      name +
      "» را حذف کنید؟"
    );


  if (!confirmDelete) {

    return;

  }


  patients.splice(
    index,
    1
  );


  localStorage.setItem(
    "patients",
    JSON.stringify(patients)
  );


  showPatients();

}


/* =====================================
   ویرایش مریض
===================================== */

function editPatient(index) {


  const patient =
    patients[index];


  const name =
    getValue(
      patient,
      [
        "name",
        "fullName",
        "patientName",
        "fullname"
      ]
    );


  const phone =
    getValue(
      patient,
      [
        "phone",
        "mobile",
        "phoneNumber",
        "contact"
      ]
    );


  const city =
    getValue(
      patient,
      [
        "city",
        "location"
      ]
    );


  const newName =
    prompt(
      "نام مریض:",
      name === "ثبت نشده"
        ? ""
        : name
    );


  if (
    newName === null
  ) {

    return;

  }


  const newPhone =
    prompt(
      "شماره تماس:",
      phone === "ثبت نشده"
        ? ""
        : phone
    );


  if (
    newPhone === null
  ) {

    return;

  }


  const newCity =
    prompt(
      "شهر:",
      city === "ثبت نشده"
        ? ""
        : city
    );


  if (
    newCity === null
  ) {

    return;

  }


  /* حفظ ساختار اطلاعات قبلی */

  if (
    patient.name !== undefined
  ) {

    patient.name =
      newName;

  } else {

    patient.fullName =
      newName;

  }


  if (
    patient.phone !== undefined
  ) {

    patient.phone =
      newPhone;

  } else if (
    patient.mobile !== undefined
  ) {

    patient.mobile =
      newPhone;

  } else {

    patient.phone =
      newPhone;

  }


  if (
    patient.city !== undefined
  ) {

    patient.city =
      newCity;

  } else {

    patient.location =
      newCity;

  }


  localStorage.setItem(
    "patients",
    JSON.stringify(patients)
  );


  showPatients();

}


/* =====================================
   جلوگیری از HTML ناخواسته
===================================== */

function escapeHTML(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =====================================
   شروع صفحه
===================================== */

showPatients();


</script>


</body>

</html>
