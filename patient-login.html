<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ورود بیمار - داکتر یار</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f5f7f7;
      color: #444;
    }

    .container {
      width: 92%;
      max-width: 650px;
      margin: 30px auto;
    }

    .card {
      background: white;
      padding: 35px 25px;
      border-radius: 30px;
      box-shadow: 0 3px 20px rgba(0,0,0,0.08);
    }

    .logo {
      text-align: center;
      color: #149e9a;
      font-size: 36px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .title {
      text-align: center;
      font-size: 28px;
      margin-bottom: 35px;
      color: #444;
    }

    .field {
      margin-bottom: 22px;
    }

    .field label {
      display: block;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    input {
      width: 100%;
      padding: 17px;
      border: 1px solid #ddd;
      border-radius: 18px;
      font-family: Tahoma;
      font-size: 17px;
      outline: none;
    }

    input:focus {
      border-color: #149e9a;
    }

    /* جنسیت */

    .gender-box {
      display: flex;
      gap: 12px;
    }

    .gender-option {
      flex: 1;
      position: relative;
    }

    .gender-option input {
      display: none;
    }

    .gender-option label {
      display: block;
      text-align: center;
      padding: 16px;
      border: 1px solid #ddd;
      border-radius: 18px;
      background: #fafafa;
      cursor: pointer;
      font-size: 18px;
      font-weight: normal;
    }

    .gender-option input:checked + label {
      background: #149e9a;
      color: white;
      border-color: #149e9a;
    }

    /* علت مریضی */

    .disease-box {
      background: #fafafa;
      border: 1px solid #ddd;
      border-radius: 20px;
      padding: 15px;
    }

    .disease-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .disease-option {
      position: relative;
    }

    .disease-option input {
      display: none;
    }

    .disease-option label {
      display: block;
      padding: 14px 8px;
      text-align: center;
      border: 1px solid #ddd;
      border-radius: 14px;
      background: white;
      color: #666;
      font-size: 16px;
      font-weight: normal;
      cursor: pointer;
    }

    .disease-option input:checked + label {
      background: #149e9a;
      color: white;
      border-color: #149e9a;
    }

    .hint {
      color: #aaa;
      font-size: 14px;
      margin-top: 8px;
    }

    .submit-btn {
      width: 100%;
      margin-top: 25px;
      padding: 18px;
      border: none;
      border-radius: 20px;
      background: #149e9a;
      color: white;
      font-family: Tahoma;
      font-size: 21px;
      font-weight: bold;
      cursor: pointer;
    }

    .submit-btn:active {
      transform: scale(0.98);
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 25px;
      color: #149e9a;
      text-decoration: none;
      font-size: 18px;
    }

  </style>

</head>

<body>

  <div class="container">

    <div class="card">

      <div class="logo">
        داکتر یار
      </div>

      <div class="title">
        ورود بیمار
      </div>


      <!-- اسم -->

      <div class="field">

        <label>
          اسم
        </label>

        <input
          type="text"
          id="patientName"
          placeholder="نام خود را وارد کنید"
          required
        >

      </div>


      <!-- سن -->

      <div class="field">

        <label>
          سن
        </label>

        <input
          type="number"
          id="patientAge"
          placeholder="سن خود را وارد کنید"
          min="1"
          max="120"
          required
        >

      </div>


      <!-- جنسیت -->

      <div class="field">

        <label>
          جنسیت
        </label>

        <div class="gender-box">

          <div class="gender-option">

            <input
              type="radio"
              name="gender"
              id="male"
              value="مرد"
            >

            <label for="male">
              مرد
            </label>

          </div>


          <div class="gender-option">

            <input
              type="radio"
              name="gender"
              id="female"
              value="زن"
            >

            <label for="female">
              زن
            </label>

          </div>

        </div>

      </div>


      <!-- علت مریضی -->

      <div class="field">

        <label>
          علت مریضی
        </label>

        <div class="disease-box">

          <div class="disease-options">


            <div class="disease-option">

              <input
                type="radio"
                name="disease"
                id="heart"
                value="قلبی"
              >

              <label for="heart">
                ❤️ قلبی
              </label>

            </div>


            <div class="disease-option">

              <input
                type="radio"
                name="disease"
                id="stomach"
                value="معده"
              >

              <label for="stomach">
                🩺 معده
              </label>

            </div>


            <div class="disease-option">

              <input
                type="radio"
                name="disease"
                id="orthopedic"
                value="ارتوپیدی"
              >

              <label for="orthopedic">
                🦴 ارتوپیدی
              </label>

            </div>


            <div class="disease-option">

              <input
                type="radio"
                name="disease"
                id="neurology"
                value="اعصاب"
              >

              <label for="neurology">
                🧠 اعصاب
              </label>

            </div>


            <div class="disease-option">

              <input
                type="radio"
                name="disease"
                id="eye"
                value="چشم"
              >

              <label for="eye">
                👁 چشم
              </label>

            </div>


            <div class="disease-option">

              <input
                type="radio"
                name="disease"
                id="ent"
                value="گوش، حلق و بینی"
              >

              <label for="ent">
                👂 گوش، حلق و بینی
              </label>

            </div>


            <div class="disease-option">

              <input
                type="radio"
                name="disease"
                id="skin"
                value="پوست"
              >

              <label for="skin">
                🩹 پوست
              </label>

            </div>


            <div class="disease-option">

              <input
                type="radio"
                name="disease"
                id="dental"
                value="دندان"
              >

              <label for="dental">
                🦷 دندان
              </label>

            </div>


            <div class="disease-option">

              <input
                type="radio"
                name="disease"
                id="other"
                value="سایر"
              >

              <label for="other">
                سایر
              </label>

            </div>

          </div>

          <div class="hint">
            یک مورد را انتخاب کنید
          </div>

        </div>

      </div>


      <!-- دکمه -->

      <button
        class="submit-btn"
        onclick="loginPatient()"
      >
        ثبت و ورود
      </button>


      <a
        href="index.html"
        class="back"
      >
        ← بازگشت به صفحه اصلی
      </a>

    </div>

  </div>


  <script>

    function loginPatient() {

      const name =
        document.getElementById("patientName").value.trim();

      const age =
        document.getElementById("patientAge").value;

      const gender =
        document.querySelector(
          'input[name="gender"]:checked'
        );

      const disease =
        document.querySelector(
          'input[name="disease"]:checked'
        );


      if (!name) {

        alert("لطفاً اسم خود را وارد کنید.");

        return;
      }


      if (!age) {

        alert("لطفاً سن خود را وارد کنید.");

        return;
      }


      if (!gender) {

        alert("لطفاً جنسیت خود را انتخاب کنید.");

        return;
      }


      if (!disease) {

        alert("لطفاً علت مریضی را انتخاب کنید.");

        return;
      }


      const patient = {

        name: name,

        age: age,

        gender: gender.value,

        disease: disease.value

      };


      localStorage.setItem(
        "patientProfile",
        JSON.stringify(patient)
      );


      localStorage.setItem(
        "patientLoggedIn",
        "true"
      );


      window.location.href =
        "patient-dashboard.html";

    }

  </script>

</body>

</html>
