<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ورود بیمار - داکتر یار</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f5f7f7;
      color: #444;
    }

    .container {
      width: 92%;
      max-width: 500px;
      margin: 50px auto;
    }

    .login-card {
      background: white;
      padding: 30px 25px;
      border-radius: 25px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    .logo {
      text-align: center;
      color: #149e9a;
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    h1 {
      text-align: center;
      font-size: 25px;
      margin: 10px 0 25px;
      color: #444;
    }

    label {
      display: block;
      margin: 15px 5px 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-family: Tahoma;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #149e9a;
    }

    .login-btn {
      width: 100%;
      padding: 16px;
      margin-top: 25px;
      border: none;
      border-radius: 14px;
      background: #149e9a;
      color: white;
      font-family: Tahoma;
      font-size: 19px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-btn:active {
      transform: scale(0.98);
    }

    .register {
      text-align: center;
      margin-top: 25px;
      line-height: 2;
    }

    .register a {
      color: #149e9a;
      font-weight: bold;
      text-decoration: none;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #777;
      text-decoration: none;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="login-card">

      <div class="logo">
        داکتر یار
      </div>

      <h1>
        ورود بیمار
      </h1>

      <form id="loginForm">

        <label for="phone">
          شماره موبایل
        </label>

        <input
          type="tel"
          id="phone"
          placeholder="مثلاً 0700000000"
          required
        >

        <label for="password">
          رمز عبور
        </label>

        <input
          type="password"
          id="password"
          placeholder="رمز عبور خود را وارد کنید"
          required
        >

        <button
          type="submit"
          class="login-btn"
        >
          ورود به حساب
        </button>

      </form>

      <div id="message"></div>

      <div class="register">
        حساب بیمار ندارید؟
        <br>
        <a href="#">
          ثبت‌نام بیمار
        </a>
      </div>

      <a
        href="index.html"
        class="back"
      >
        ← بازگشت به صفحه اصلی
      </a>

    </div>

  </div>


  <script>

    document
      .getElementById("loginForm")
      .addEventListener("submit", function(event) {

        event.preventDefault();

        const phone =
          document.getElementById("phone").value.trim();

        const password =
          document.getElementById("password").value.trim();

        const message =
          document.getElementById("message");


        if (phone === "" || password === "") {

          message.style.color = "red";

          message.textContent =
            "لطفاً شماره موبایل و رمز عبور را وارد کنید.";

          return;
        }


        /*
          فعلاً ورود آزمایشی است.
          بعداً سیستم واقعی ثبت‌نام و حساب بیمار را وصل می‌کنیم.
        */

        const patient = {
          name: "بیمار",
          phone: phone
        };


        localStorage.setItem(
          "patientLoggedIn",
          "true"
        );


        localStorage.setItem(
          "patientProfile",
          JSON.stringify(patient)
        );


        message.style.color = "#149e9a";

        message.textContent =
          "ورود موفق بود...";


        setTimeout(function() {

          window.location.href =
            "patient-dashboard.html";

        }, 700);

      });

  </script>

</body>

</html>
