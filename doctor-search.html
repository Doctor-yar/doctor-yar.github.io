<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>جستجوی داکتر | داکتر یار</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f5f7f7;
      color: #444;
    }

    .container {
      width: 92%;
      max-width: 650px;
      margin: 25px auto;
    }

    .header {
      background: #149e9a;
      color: white;
      padding: 25px;
      border-radius: 25px;
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .header p {
      margin: 0;
      font-size: 16px;
    }

    .search-box {
      background: white;
      padding: 20px;
      border-radius: 25px;
      box-shadow: 0 2px 15px rgba(0,0,0,0.08);
    }

    .search-input {
      width: 100%;
      padding: 18px;
      border: 1px solid #ddd;
      border-radius: 20px;
      font-size: 17px;
      font-family: inherit;
      outline: none;
    }

    .search-input:focus {
      border-color: #149e9a;
    }

    .search-btn {
      width: 100%;
      margin-top: 12px;
      padding: 18px;
      border: none;
      border-radius: 20px;
      background: #149e9a;
      color: white;
      font-size: 19px;
      font-family: inherit;
      cursor: pointer;
    }

    .results {
      margin-top: 20px;
    }

    .doctor-card {
      background: white;
      padding: 20px;
      border-radius: 22px;
      margin-bottom: 15px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }

    .doctor-name {
      color: #149e9a;
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .doctor-info {
      font-size: 16px;
      line-height: 2;
    }

    .doctor-info strong {
      color: #555;
    }

    .visit-type {
      display: inline-block;
      background: #e9f8f7;
      color: #149e9a;
      padding: 6px 10px;
      border-radius: 10px;
      margin: 3px;
    }

    .no-result {
      background: white;
      padding: 25px;
      border-radius: 20px;
      text-align: center;
      color: #777;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #149e9a;
      text-decoration: none;
      font-size: 18px;
    }

  </style>

</head>

<body>

  <div class="container">

    <div class="header">

      <h1>جستجوی داکتر</h1>

      <p>
        نام، تخصص یا شهر را جستجو کنید
      </p>

    </div>


    <div class="search-box">

      <input
        type="text"
        id="searchInput"
        class="search-input"
        placeholder="مثلاً احمد، قلب، کابل..."
      >

      <button
        class="search-btn"
        onclick="searchDoctor()"
      >
        جستجوی داکتر
      </button>

    </div>


    <div
      id="results"
      class="results"
    ></div>


    <a
      href="index.html"
      class="back-link"
    >
      ← بازگشت به صفحه اصلی
    </a>

  </div>


  <script>

    function searchDoctor() {

      const searchText =
        document
          .getElementById("searchInput")
          .value
          .trim()
          .toLowerCase();


      const results =
        document.getElementById("results");


      const savedProfile =
        localStorage.getItem("doctorProfile");


      // اگر هنوز داکتری ثبت نشده باشد
      if (!savedProfile) {

        results.innerHTML = `
          <div class="no-result">
            هنوز مشخصات هیچ داکتری ثبت نشده است.
          </div>
        `;

        return;
      }


      let doctor;

      try {

        doctor =
          JSON.parse(savedProfile);

      } catch (error) {

        results.innerHTML = `
          <div class="no-result">
            اطلاعات داکتر قابل خواندن نیست.
          </div>
        `;

        return;
      }


      // متن قابل جستجو
      const searchableText = (

        (doctor.doctorName || "") + " " +
        (doctor.specialty || "") + " " +
        (doctor.city || "") + " " +
        (doctor.address || "")

      ).toLowerCase();


      // اگر چیزی جستجو نشده باشد
      // همه اطلاعات داکتر نمایش داده می‌شود
      if (
        searchText !== "" &&
        !searchableText.includes(searchText)
      ) {

        results.innerHTML = `
          <div class="no-result">
            داکتری با این مشخصات پیدا نشد.
          </div>
        `;

        return;
      }


      // نوع ویزیت
      let visitTypesHTML = "";

      if (
        Array.isArray(doctor.visitTypes) &&
        doctor.visitTypes.length > 0
      ) {

        doctor.visitTypes.forEach(function(type) {

          visitTypesHTML += `
            <span class="visit-type">
              ${type}
            </span>
          `;

        });

      } else {

        visitTypesHTML =
          "ثبت نشده";

      }


      // قیمت ویزیت
      let priceHTML = "ثبت نشده";

      if (doctor.visitPrice) {

        priceHTML =
          doctor.visitPrice + " افغانی";

      }


      // نمایش داکتر
      results.innerHTML = `

        <div class="doctor-card">

          <div class="doctor-name">
            ${doctor.doctorName || "نام ثبت نشده"}
          </div>

          <div class="doctor-info">

            <strong>تخصص:</strong>
            ${doctor.specialty || "ثبت نشده"}
            <br>

            <strong>شهر:</strong>
            ${doctor.city || "ثبت نشده"}
            <br>

            <strong>شماره تماس:</strong>
            ${doctor.phone || "ثبت نشده"}
            <br>

            <strong>آدرس:</strong>
            ${doctor.address || "ثبت نشده"}
            <br>

            <strong>ساعات کاری:</strong>
            ${doctor.workingHours || "ثبت نشده"}
            <br>

            <strong>قیمت ویزیت:</strong>
            ${priceHTML}
            <br>

            <strong>نوع ویزیت:</strong>
            <br>

            ${visitTypesHTML}

            <br>

            <strong>معرفی:</strong>
            ${doctor.about || "ثبت نشده"}

            <br><br>

            <strong>خدمات:</strong>
            ${doctor.services || "ثبت نشده"}

          </div>

        </div>

      `;

    }


    // با زدن Enter هم جستجو انجام شود
    document
      .getElementById("searchInput")
      .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {

          searchDoctor();

        }

      });

  </script>

</body>

</html>
