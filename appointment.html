<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>گرفتن نوبت | داکتر یار</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Tahoma, Arial, sans-serif;
      background: #f5f7f7;
      color: #444;
    }

    .container {
      width: 100%;
      max-width: 650px;
      margin: auto;
    }

    .header {
      background: #149e9a;
      color: white;
      padding: 25px;
      border-radius: 25px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 27px;
    }

    .card {
      background: white;
      margin-top: 20px;
      padding: 22px;
      border-radius: 22px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }

    .doctor-name {
      color: #149e9a;
      font-size: 23px;
      font-weight: bold;
      text-align: center;
    }

    .doctor-specialty {
      text-align: center;
      margin-top: 8px;
      color: #777;
    }

    .title {
      color: #149e9a;
      font-size: 21px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 8px;
      font-weight: bold;
      font-size: 17px;
    }

    select {
      width: 100%;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 15px;
      font-family: Tahoma;
      font-size: 17px;
      background: white;
    }

    .day-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .day-btn,
    .time-btn {
      border: 1px solid #149e9a;
      background: white;
      color: #149e9a;
      padding: 14px 8px;
      border-radius: 14px;
      font-family: Tahoma;
      font-size: 16px;
      cursor: pointer;
    }

    .day-btn.selected,
    .time-btn.selected {
      background: #149e9a;
      color: white;
    }

    .time-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .submit-btn {
      width: 100%;
      margin-top: 20px;
      padding: 17px;
      border: none;
      border-radius: 16px;
      background: #149e9a;
      color: white;
      font-family: Tahoma;
      font-size: 19px;
      font-weight: bold;
      cursor: pointer;
    }

    .message {
      text-align: center;
      margin-top: 15px;
      line-height: 2;
    }

    .back {
      display: block;
      text-align: center;
      margin: 22px 0;
      color: #149e9a;
      text-decoration: none;
      font-size: 17px;
    }

  </style>

</head>

<body>

<div class="container">


  <div class="header">

    <h1>
      📅 گرفتن نوبت
    </h1>

  </div>


  <!-- مشخصات داکتر -->

  <div class="card">

    <div
      id="doctorName"
      class="doctor-name"
    >
      داکتر
    </div>

    <div
      id="doctorSpecialty"
      class="doctor-specialty"
    >
      تخصص
    </div>

  </div>


  <!-- انتخاب روز -->

  <div class="card">

    <div class="title">
      📅 انتخاب روز
    </div>

    <div class="day-buttons">

      <button
        class="day-btn"
        onclick="selectDay(this,'شنبه')"
      >
        شنبه
      </button>

      <button
        class="day-btn"
        onclick="selectDay(this,'یکشنبه')"
      >
        یکشنبه
      </button>

      <button
        class="day-btn"
        onclick="selectDay(this,'دوشنبه')"
      >
        دوشنبه
      </button>

      <button
        class="day-btn"
        onclick="selectDay(this,'سه‌شنبه')"
      >
        سه‌شنبه
      </button>

      <button
        class="day-btn"
        onclick="selectDay(this,'چهارشنبه')"
      >
        چهارشنبه
      </button>

      <button
        class="day-btn"
        onclick="selectDay(this,'پنجشنبه')"
      >
        پنجشنبه
      </button>

    </div>

  </div>


  <!-- انتخاب ساعت -->

  <div class="card">

    <div class="title">
      🕐 انتخاب ساعت
    </div>

    <div class="time-buttons">

      <button
        class="time-btn"
        onclick="selectTime(this,'09:00')"
      >
        ۹:۰۰ صبح
      </button>

      <button
        class="time-btn"
        onclick="selectTime(this,'10:00')"
      >
        ۱۰:۰۰ صبح
      </button>

      <button
        class="time-btn"
        onclick="selectTime(this,'11:00')"
      >
        ۱۱:۰۰ صبح
      </button>

      <button
        class="time-btn"
        onclick="selectTime(this,'14:00')"
      >
        ۲:۰۰ بعد از ظهر
      </button>

      <button
        class="time-btn"
        onclick="selectTime(this,'15:00')"
      >
        ۳:۰۰ بعد از ظهر
      </button>

      <button
        class="time-btn"
        onclick="selectTime(this,'16:00')"
      >
        ۴:۰۰ بعد از ظهر
      </button>

    </div>

  </div>


  <!-- نوع ویزیت -->

  <div class="card">

    <div class="title">
      🩺 نوع ویزیت
    </div>

    <select id="visitType">

      <option value="">
        نوع ویزیت را انتخاب کنید
      </option>

      <option>
        ویزیت حضوری
      </option>

      <option>
        ویزیت آنلاین
      </option>

    </select>


    <button
      class="submit-btn"
      onclick="bookAppointment()"
    >
      ✅ ثبت نوبت
    </button>

    <div
      id="message"
      class="message"
    ></div>

  </div>


  <a
    href="doctor-profile-view.html"
    class="back"
  >
    ← بازگشت به پروفایل داکتر
  </a>


</div>


<script>

let selectedDay = "";
let selectedTime = "";


/* گرفتن اطلاعات داکتر */

const savedDoctor =
  localStorage.getItem("doctorProfile");


if (savedDoctor) {

  try {

    const doctor =
      JSON.parse(savedDoctor);

    document.getElementById(
      "doctorName"
    ).textContent =
      doctor.doctorName || "داکتر";

    document.getElementById(
      "doctorSpecialty"
    ).textContent =
      doctor.specialty || "تخصص ثبت نشده";

  } catch(error) {

    console.log("خطا در اطلاعات داکتر");

  }

}


/* انتخاب روز */

function selectDay(button, day) {

  document
    .querySelectorAll(".day-btn")
    .forEach(function(btn) {

      btn.classList.remove("selected");

    });

  button.classList.add("selected");

  selectedDay = day;

}


/* انتخاب ساعت */

function selectTime(button, time) {

  document
    .querySelectorAll(".time-btn")
    .forEach(function(btn) {

      btn.classList.remove("selected");

    });

  button.classList.add("selected");

  selectedTime = time;

}


/* ثبت نوبت */

function bookAppointment() {

  const visitType =
    document.getElementById("visitType").value;

  const message =
    document.getElementById("message");


  if (!selectedDay) {

    message.innerHTML =
      "⚠️ لطفاً یک روز را انتخاب کنید.";

    message.style.color = "#b32626";

    return;

  }


  if (!selectedTime) {

    message.innerHTML =
      "⚠️ لطفاً یک ساعت را انتخاب کنید.";

    message.style.color = "#b32626";

    return;

  }


  if (!visitType) {

    message.innerHTML =
      "⚠️ لطفاً نوع ویزیت را انتخاب کنید.";

    message.style.color = "#b32626";

    return;

  }


  let doctorName = "داکتر";

  if (savedDoctor) {

    try {

      const doctor =
        JSON.parse(savedDoctor);

      doctorName =
        doctor.doctorName || "داکتر";

    } catch(error) {}

  }


  const appointment = {

    doctorName: doctorName,

    day: selectedDay,

    time: selectedTime,

    visitType: visitType,

    date: new Date().toLocaleString("fa-IR")

  };


  localStorage.setItem(
    "myAppointment",
    JSON.stringify(appointment)
  );


  message.innerHTML =
    "✅ نوبت شما با موفقیت ثبت شد.<br>" +
    "📅 " + selectedDay +
    "<br>" +
    "🕐 " + selectedTime;


  message.style.color =
    "#149e9a";

}

</script>

</body>

</html>
