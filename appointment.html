<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>گرفتن نوبت | داکتر یار</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f5f7f7;
      color: #444;
    }

    .container {
      width: 92%;
      max-width: 650px;
      margin: 25px auto;
    }

    .header {
      background: #149e9a;
      color: white;
      padding: 25px 20px;
      border-radius: 25px;
      text-align: center;
    }

    .doctor-icon {
      font-size: 50px;
    }

    .doctor-name {
      font-size: 25px;
      font-weight: bold;
      margin-top: 8px;
    }

    .specialty {
      font-size: 17px;
      margin-top: 7px;
    }

    .card {
      background: white;
      margin-top: 18px;
      padding: 22px;
      border-radius: 22px;
      box-shadow: 0 2px 14px rgba(0,0,0,0.07);
    }

    .title {
      color: #149e9a;
      font-size: 21px;
      font-weight: bold;
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input,
    select {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-family: Tahoma;
      font-size: 16px;
      margin-bottom: 16px;
      background: white;
    }

    .times {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .time {
      padding: 14px;
      border: 2px solid #149e9a;
      color: #149e9a;
      background: white;
      border-radius: 12px;
      text-align: center;
      cursor: pointer;
      font-size: 16px;
    }

    .time.selected {
      background: #149e9a;
      color: white;
    }

    .time.taken {
      background: #eee;
      border-color: #ccc;
      color: #999;
      cursor: not-allowed;
      text-decoration: line-through;
    }

    .submit-btn {
      width: 100%;
      padding: 16px;
      margin-top: 18px;
      border: none;
      border-radius: 15px;
      background: #149e9a;
      color: white;
      font-family: Tahoma;
      font-size: 18px;
      cursor: pointer;
    }

    .submit-btn:active {
      transform: scale(0.98);
    }

    .message {
      margin-top: 15px;
      padding: 15px;
      border-radius: 12px;
      text-align: center;
      display: none;
      line-height: 1.8;
    }

    .success {
      display: block;
      background: #e8f8f2;
      color: #147a57;
    }

    .error {
      display: block;
      background: #fff0f0;
      color: #b32626;
    }

    .back {
      display: block;
      text-align: center;
      margin: 22px 0;
      color: #149e9a;
      text-decoration: none;
      font-size: 17px;
    }

  </style>

</head>

<body>

  <div class="container">

    <div id="doctorHeader"></div>

    <div class="card">

      <div class="title">
        📅 گرفتن نوبت
      </div>

      <label>
        نام شما
      </label>

      <input
        type="text"
        id="patientName"
        placeholder="نام و نام خانوادگی"
      >

      <label>
        شماره تماس
      </label>

      <input
        type="tel"
        id="patientPhone"
        placeholder="شماره تماس"
      >

      <label>
        انتخاب تاریخ
      </label>

      <input
        type="date"
        id="appointmentDate"
      >

      <label>
        انتخاب ساعت
      </label>

      <div
        class="times"
        id="times"
      ></div>

      <button
        class="submit-btn"
        onclick="bookAppointment()"
      >
        ✅ ثبت نوبت
      </button>

      <div
        id="message"
        class="message"
      ></div>

    </div>

    <a
      href="doctor-profile.html"
      class="back"
    >
      ← بازگشت به پروفایل داکتر
    </a>

  </div>


  <script>

    // دریافت اطلاعات داکتر
    const savedProfile =
      localStorage.getItem("doctorProfile");

    let doctor = null;

    if (savedProfile) {

      try {

        doctor = JSON.parse(savedProfile);

      } catch (error) {

        doctor = null;

      }

    }


    // نمایش نام داکتر
    const doctorHeader =
      document.getElementById("doctorHeader");


    if (doctor) {

      doctorHeader.innerHTML = `

        <div class="header">

          <div class="doctor-icon">
            👨‍⚕️
          </div>

          <div class="doctor-name">
            ${doctor.doctorName || "داکتر"}
          </div>

          <div class="specialty">
            ${doctor.specialty || ""}
          </div>

        </div>

      `;

    } else {

      doctorHeader.innerHTML = `

        <div class="header">

          <div class="doctor-icon">
            👨‍⚕️
          </div>

          <div class="doctor-name">
            داکتر
          </div>

        </div>

      `;

    }


    // ساعت‌های نمونه
    const availableTimes = [

      "08:00",
      "08:30",
      "09:00",
      "09:30",
      "10:00",
      "10:30",
      "11:00",
      "11:30",
      "14:00",
      "14:30",
      "15:00",
      "15:30",
      "16:00",
      "16:30"

    ];


    let selectedTime = "";


    // نمایش ساعت‌ها
    function showTimes() {

      const timesBox =
        document.getElementById("times");

      timesBox.innerHTML = "";

      availableTimes.forEach(function(time) {

        const button =
          document.createElement("div");

        button.className = "time";

        button.innerText = time;

        button.onclick = function() {

          document
            .querySelectorAll(".time")
            .forEach(function(item) {

              item.classList.remove("selected");

            });

          button.classList.add("selected");

          selectedTime = time;

        };

        timesBox.appendChild(button);

      });

    }


    showTimes();


    // تاریخ امروز
    const dateInput =
      document.getElementById("appointmentDate");

    const today =
      new Date();

    const year =
      today.getFullYear();

    const month =
      String(today.getMonth() + 1)
      .padStart(2, "0");

    const day =
      String(today.getDate())
      .padStart(2, "0");

    const todayString =
      year + "-" + month + "-" + day;

    dateInput.min = todayString;


    // ثبت نوبت
    function bookAppointment() {

      const name =
        document
          .getElementById("patientName")
          .value
          .trim();

      const phone =
        document
          .getElementById("patientPhone")
          .value
          .trim();

      const date =
        document
          .getElementById("appointmentDate")
          .value;


      const message =
        document.getElementById("message");


      if (!name) {

        showMessage(
          "لطفاً نام خود را وارد کنید.",
          "error"
        );

        return;

      }


      if (!phone) {

        showMessage(
          "لطفاً شماره تماس خود را وارد کنید.",
          "error"
        );

        return;

      }


      if (!date) {

        showMessage(
          "لطفاً تاریخ نوبت را انتخاب کنید.",
          "error"
        );

        return;

      }


      if (!selectedTime) {

        showMessage(
          "لطفاً یک ساعت را انتخاب کنید.",
          "error"
        );

        return;

      }


      // دریافت نوبت‌های قبلی
      let appointments =
        JSON.parse(
          localStorage.getItem("appointments") || "[]"
        );


      // بررسی اینکه این ساعت قبلاً گرفته نشده باشد
      const alreadyBooked =
        appointments.some(function(item) {

          return (
            item.doctorName ===
              (doctor?.doctorName || "داکتر")
            &&
            item.date === date
            &&
            item.time === selectedTime
          );

        });


      if (alreadyBooked) {

        showMessage(
          "این ساعت قبلاً گرفته شده است. لطفاً ساعت دیگری انتخاب کنید.",
          "error"
        );

        return;

      }


      // ساخت نوبت
      const appointment = {

        id: Date.now(),

        doctorName:
          doctor?.doctorName || "داکتر",

        specialty:
          doctor?.specialty || "",

        patientName:
          name,

        patientPhone:
          phone,

        date:
          date,

        time:
          selectedTime

      };


      // ذخیره نوبت
      appointments.push(appointment);


      localStorage.setItem(
        "appointments",
        JSON.stringify(appointments)
      );


      showMessage(
        "✅ نوبت شما با موفقیت ثبت شد.<br>" +
        "تاریخ: " + date +
        "<br>" +
        "ساعت: " + selectedTime,
        "success"
      );


      // پاک کردن فرم
      document
        .getElementById("patientName")
        .value = "";

      document
        .getElementById("patientPhone")
        .value = "";

      selectedTime = "";

      document
        .querySelectorAll(".time")
        .forEach(function(item) {

          item.classList.remove("selected");

        });

    }


    function showMessage(text, type) {

      const message =
        document.getElementById("message");

      message.innerHTML = text;

      message.className =
        "message " + type;

    }

  </script>

</body>

</html>
