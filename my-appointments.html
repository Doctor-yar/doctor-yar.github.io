<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>نوبت‌های من | داکتر یار</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f5f7f7;
      color: #444;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 650px;
      margin: auto;
    }

    .header {
      background: #149e9a;
      color: white;
      padding: 25px;
      border-radius: 25px;
      text-align: center;
    }

    .header-icon {
      font-size: 45px;
    }

    .header-title {
      font-size: 25px;
      font-weight: bold;
      margin-top: 8px;
    }

    .appointment {
      background: white;
      margin-top: 20px;
      padding: 22px;
      border-radius: 22px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }

    .doctor-name {
      font-size: 22px;
      font-weight: bold;
      color: #149e9a;
      text-align: center;
      margin-bottom: 18px;
    }

    .info {
      padding: 10px 0;
      border-bottom: 1px solid #eee;
      line-height: 1.8;
      font-size: 17px;
    }

    .label {
      font-weight: bold;
      color: #555;
    }

    .status {
      margin-top: 18px;
      padding: 12px;
      border-radius: 12px;
      text-align: center;
      font-weight: bold;
      line-height: 1.8;
    }

    .pending {
      background: #fff7df;
      color: #9a7000;
    }

    .confirmed {
      background: #e8f8f2;
      color: #147a57;
    }

    .cancelled {
      background: #fff0f0;
      color: #b32626;
    }

    .empty {
      background: white;
      margin-top: 20px;
      padding: 30px 20px;
      border-radius: 20px;
      text-align: center;
      line-height: 2;
      color: #777;
    }

    .back {
      display: block;
      margin: 22px 0;
      text-align: center;
      color: #149e9a;
      text-decoration: none;
      font-size: 18px;
    }

    .cancel-btn {
      width: 100%;
      margin-top: 18px;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #fff0f0;
      color: #b32626;
      font-family: Tahoma;
      font-size: 16px;
      cursor: pointer;
    }

  </style>

</head>

<body>

<div class="container">

  <div class="header">

    <div class="header-icon">
      📅
    </div>

    <div class="header-title">
      نوبت‌های من
    </div>

  </div>


  <div id="appointments"></div>


  <a
    href="patient-dashboard.html"
    class="back"
  >
    ← بازگشت به صفحه اصلی بیمار
  </a>

</div>


<script>

const appointmentsBox =
  document.getElementById("appointments");


/* اطلاعات بیمار */

let patient = null;

const savedPatient =
  localStorage.getItem("patientProfile");


if (savedPatient) {

  try {

    patient =
      JSON.parse(savedPatient);

  } catch (error) {

    patient = null;

  }

}


/* دریافت تمام نوبت‌ها */

let appointments = [];

try {

  appointments =
    JSON.parse(
      localStorage.getItem("appointments") || "[]"
    );

} catch (error) {

  appointments = [];

}


/*
  فقط نوبت‌های همین بیمار نمایش داده شود
*/

if (patient && patient.name) {

  appointments =
    appointments.filter(function(item) {

      return item.patientName === patient.name;

    });

}


/* اگر نوبتی وجود ندارد */

if (appointments.length === 0) {

  appointmentsBox.innerHTML = `

    <div class="empty">

      📭

      <br>

      هنوز هیچ نوبتی ثبت نکرده‌اید.

      <br><br>

      برای گرفتن نوبت، ابتدا یک داکتر را جستجو کنید.

    </div>

  `;

}


/* نمایش نوبت‌ها */

appointments.forEach(function(item, index) {

  const card =
    document.createElement("div");

  card.className =
    "appointment";


  /* وضعیت نوبت */

  const status =
    item.status || "pending";


  let statusText =
    "⏳ نوبت شما در انتظار تأیید داکتر است.";

  let statusClass =
    "pending";


  if (status === "confirmed") {

    statusText =
      "✅ نوبت شما توسط داکتر تأیید شده است.";

    statusClass =
      "confirmed";

  }


  if (status === "cancelled") {

    statusText =
      "❌ این نوبت توسط داکتر لغو شده است.";

    statusClass =
      "cancelled";

  }


  card.innerHTML = `

    <div class="doctor-name">

      👨‍⚕️ ${item.doctorName || "داکتر"}

    </div>


    <div class="info">

      <span class="label">
        🩺 تخصص:
      </span>

      ${item.specialty || "ثبت نشده"}

    </div>


    <div class="info">

      <span class="label">
        📅 روز نوبت:
      </span>

      ${item.day || "ثبت نشده"}

    </div>


    <div class="info">

      <span class="label">
        🕐 ساعت:
      </span>

      ${item.time || "ثبت نشده"}

    </div>


    <div class="info">

      <span class="label">
        🩺 نوع ویزیت:
      </span>

      ${item.visitType || "ثبت نشده"}

    </div>


    <div class="info">

      <span class="label">
        📝 زمان ثبت:
      </span>

      ${item.date || "ثبت نشده"}

    </div>


    <div class="status ${statusClass}">

      ${statusText}

    </div>


    ${
      status !== "cancelled"
      ? `

        <button
          class="cancel-btn"
          onclick="cancelAppointment(${item.id})"
        >
          لغو نوبت
        </button>

      `
      : ""
    }

  `;


  appointmentsBox.appendChild(card);

});


/* لغو نوبت بیمار */

function cancelAppointment(id) {

  const answer =
    confirm(
      "آیا مطمئن هستید که می‌خواهید این نوبت را لغو کنید؟"
    );


  if (!answer) {
    return;
  }


  let allAppointments = [];

  try {

    allAppointments =
      JSON.parse(
        localStorage.getItem("appointments") || "[]"
      );

  } catch (error) {

    allAppointments = [];

  }


  /*
    تغییر وضعیت نوبت به لغو شده
  */

  allAppointments =
    allAppointments.map(function(item) {

      if (item.id === id) {

        item.status =
          "cancelled";

      }

      return item;

    });


  localStorage.setItem(
    "appointments",
    JSON.stringify(allAppointments)
  );


  alert(
    "❌ نوبت شما لغو شد."
  );


  location.reload();

}

</script>

</body>

</html>
