<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>نوبت‌های من | داکتر یار</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f5f7f7;
      color: #444;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 650px;
      margin: auto;
    }

    .header {
      background: #149e9a;
      color: white;
      padding: 25px;
      border-radius: 25px;
      text-align: center;
    }

    .header-icon {
      font-size: 45px;
    }

    .header-title {
      font-size: 25px;
      font-weight: bold;
      margin-top: 8px;
    }

    .appointment {
      background: white;
      margin-top: 20px;
      padding: 22px;
      border-radius: 22px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }

    .doctor-name {
      font-size: 22px;
      font-weight: bold;
      color: #149e9a;
      text-align: center;
      margin-bottom: 18px;
    }

    .info {
      padding: 10px 0;
      border-bottom: 1px solid #eee;
      line-height: 1.8;
      font-size: 17px;
    }

    .info:last-child {
      border-bottom: none;
    }

    .label {
      font-weight: bold;
      color: #555;
    }

    .status {
      margin-top: 18px;
      padding: 10px;
      border-radius: 12px;
      background: #e8f8f2;
      color: #147a57;
      text-align: center;
      font-weight: bold;
    }

    .empty {
      background: white;
      margin-top: 20px;
      padding: 30px 20px;
      border-radius: 20px;
      text-align: center;
      line-height: 2;
      color: #777;
    }

    .back {
      display: block;
      margin: 22px 0;
      text-align: center;
      color: #149e9a;
      text-decoration: none;
      font-size: 18px;
    }

    .cancel-btn {
      width: 100%;
      margin-top: 18px;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #fff0f0;
      color: #b32626;
      font-family: Tahoma;
      font-size: 16px;
      cursor: pointer;
    }

  </style>

</head>

<body>

<div class="container">

  <div class="header">

    <div class="header-icon">
      📅
    </div>

    <div class="header-title">
      نوبت‌های من
    </div>

  </div>


  <div id="appointments"></div>


  <a
    href="patient-dashboard.html"
    class="back"
  >
    ← بازگشت به صفحه اصلی بیمار
  </a>

</div>


<script>

const appointmentsBox =
  document.getElementById("appointments");


/* دریافت نوبت ثبت‌شده */

const savedAppointment =
  localStorage.getItem("myAppointment");


/* اگر نوبتی وجود ندارد */

if (!savedAppointment) {

  appointmentsBox.innerHTML = `

    <div class="empty">

      📭

      <br>

      هنوز هیچ نوبتی ثبت نکرده‌اید.

      <br><br>

      برای گرفتن نوبت، ابتدا یک داکتر را جستجو کنید.

    </div>

  `;

}


/* اگر نوبت وجود دارد */

else {

  try {

    const appointment =
      JSON.parse(savedAppointment);


    const card =
      document.createElement("div");


    card.className =
      "appointment";


    card.innerHTML = `

      <div class="doctor-name">
        👨‍⚕️ ${appointment.doctorName || "داکتر"}
      </div>


      <div class="info">

        <span class="label">
          📅 روز نوبت:
        </span>

        ${appointment.day || "ثبت نشده"}

      </div>


      <div class="info">

        <span class="label">
          🕐 ساعت:
        </span>

        ${appointment.time || "ثبت نشده"}

      </div>


      <div class="info">

        <span class="label">
          🩺 نوع ویزیت:
        </span>

        ${appointment.visitType || "ثبت نشده"}

      </div>


      <div class="info">

        <span class="label">
          📝 زمان ثبت:
        </span>

        ${appointment.date || "ثبت نشده"}

      </div>


      <div class="status">
        ✅ نوبت با موفقیت ثبت شده است
      </div>


      <button
        class="cancel-btn"
        onclick="cancelAppointment()"
      >
        لغو نوبت
      </button>

    `;


    appointmentsBox.appendChild(card);


  } catch(error) {

    appointmentsBox.innerHTML = `

      <div class="empty">

        ⚠️ اطلاعات نوبت قابل خواندن نیست.

      </div>

    `;

  }

}


/* لغو نوبت */

function cancelAppointment() {

  const answer =
    confirm(
      "آیا مطمئن هستید که می‌خواهید نوبت را لغو کنید؟"
    );


  if (!answer) {
    return;
  }


  localStorage.removeItem(
    "myAppointment"
  );


  location.reload();

}

</script>

</body>

</html>
