<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>نوبت‌های من | داکتر یار</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f5f7f7;
      color: #444;
    }

    .container {
      width: 92%;
      max-width: 650px;
      margin: 25px auto;
    }

    .header {
      background: #149e9a;
      color: white;
      padding: 25px;
      border-radius: 25px;
      text-align: center;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    .header-icon {
      font-size: 45px;
    }

    .header-title {
      font-size: 25px;
      font-weight: bold;
      margin-top: 8px;
    }

    .appointment {
      background: white;
      margin-top: 18px;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
    }

    .doctor-name {
      font-size: 21px;
      font-weight: bold;
      color: #149e9a;
      margin-bottom: 12px;
    }

    .info {
      padding: 8px 0;
      border-bottom: 1px solid #eee;
      line-height: 1.8;
    }

    .info:last-child {
      border-bottom: none;
    }

    .label {
      font-weight: bold;
    }

    .status {
      display: inline-block;
      margin-top: 12px;
      padding: 7px 12px;
      border-radius: 10px;
      background: #e8f8f2;
      color: #147a57;
    }

    .empty {
      background: white;
      margin-top: 20px;
      padding: 30px 20px;
      border-radius: 20px;
      text-align: center;
      line-height: 2;
      color: #777;
    }

    .back {
      display: block;
      margin: 22px 0;
      text-align: center;
      color: #149e9a;
      text-decoration: none;
      font-size: 18px;
    }

    .cancel-btn {
      width: 100%;
      margin-top: 15px;
      padding: 13px;
      border: none;
      border-radius: 12px;
      background: #fff0f0;
      color: #b32626;
      font-family: Tahoma;
      font-size: 16px;
      cursor: pointer;
    }

  </style>

</head>

<body>

  <div class="container">

    <div class="header">

      <div class="header-icon">
        📅
      </div>

      <div class="header-title">
        نوبت‌های من
      </div>

    </div>


    <div id="appointments"></div>


    <a
      href="patient-dashboard.html"
      class="back"
    >
      ← بازگشت به صفحه اصلی بیمار
    </a>

  </div>


  <script>

    const appointmentsBox =
      document.getElementById("appointments");


    // دریافت نوبت‌ها
    let appointments =
      JSON.parse(
        localStorage.getItem("appointments") || "[]"
      );


    // دریافت اطلاعات بیمار
    let patient = null;

    const savedPatient =
      localStorage.getItem("patientProfile");


    if (savedPatient) {

      try {

        patient =
          JSON.parse(savedPatient);

      } catch (error) {

        patient = null;

      }

    }


    /*
      فقط نوبت‌های همین بیمار نمایش داده شود
    */

    if (patient && patient.name) {

      appointments =
        appointments.filter(function(item) {

          return item.patientName === patient.name;

        });

    }


    // اگر نوبتی وجود ندارد
    if (appointments.length === 0) {

      appointmentsBox.innerHTML = `

        <div class="empty">

          📭

          <br>

          هنوز هیچ نوبتی ثبت نکرده‌اید.

          <br><br>

          برای گرفتن نوبت، ابتدا یک داکتر را جستجو کنید.

        </div>

      `;

    }


    // نمایش نوبت‌ها
    appointments.forEach(function(item, index) {

      const card =
        document.createElement("div");

      card.className = "appointment";


      card.innerHTML = `

        <div class="doctor-name">
          👨‍⚕️ ${item.doctorName || "داکتر"}
        </div>

        <div class="info">
          <span class="label">
            تخصص:
          </span>
          ${item.specialty || "ثبت نشده"}
        </div>

        <div class="info">
          <span class="label">
            👤 بیمار:
          </span>
          ${item.patientName || "ثبت نشده"}
        </div>

        <div class="info">
          <span class="label">
            📞 شماره تماس:
          </span>
          ${item.patientPhone || "ثبت نشده"}
        </div>

        <div class="info">
          <span class="label">
            📅 تاریخ:
          </span>
          ${item.date || "ثبت نشده"}
        </div>

        <div class="info">
          <span class="label">
            🕐 ساعت:
          </span>
          ${item.time || "ثبت نشده"}
        </div>

        <div class="status">
          ✅ نوبت ثبت شده
        </div>

        <button
          class="cancel-btn"
          onclick="cancelAppointment(${item.id})"
        >
          لغو نوبت
        </button>

      `;


      appointmentsBox.appendChild(card);

    });


    // لغو نوبت
    function cancelAppointment(id) {

      const confirmCancel =
        confirm(
          "آیا مطمئن هستید که می‌خواهید این نوبت را لغو کنید؟"
        );


      if (!confirmCancel) {
        return;
      }


      let allAppointments =
        JSON.parse(
          localStorage.getItem("appointments") || "[]"
        );


      allAppointments =
        allAppointments.filter(function(item) {

          return item.id !== id;

        });


      localStorage.setItem(
        "appointments",
        JSON.stringify(allAppointments)
      );


      // تازه‌سازی صفحه
      location.reload();

    }

  </script>

</body>

</html>
