<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>پروفایل داکتر | داکتر یار</title>

  <!-- اتصال به Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f5f7f7;
      color: #444;
    }

    .container {
      width: 92%;
      max-width: 650px;
      margin: 25px auto;
    }

    .header {
      background: #149e9a;
      color: white;
      padding: 28px 20px;
      border-radius: 25px;
      text-align: center;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    .doctor-icon {
      font-size: 55px;
      margin-bottom: 8px;
    }

    .doctor-name {
      font-size: 27px;
      font-weight: bold;
    }

    .specialty {
      font-size: 18px;
      margin-top: 8px;
    }

    .card {
      background: white;
      margin-top: 18px;
      padding: 22px;
      border-radius: 22px;
      box-shadow: 0 2px 14px rgba(0,0,0,0.07);
    }

    .card-title {
      font-size: 21px;
      font-weight: bold;
      color: #149e9a;
      margin-bottom: 16px;
    }

    .info-row {
      padding: 10px 0;
      border-bottom: 1px solid #eee;
      font-size: 17px;
      line-height: 1.8;
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .label {
      font-weight: bold;
      color: #555;
    }

    .visit-type {
      display: inline-block;
      background: #e9f8f7;
      color: #149e9a;
      padding: 7px 12px;
      border-radius: 10px;
      margin: 4px;
    }

    .day {
      background: #f5f7f7;
      margin-bottom: 10px;
      padding: 13px;
      border-radius: 15px;
      font-size: 16px;
      line-height: 1.8;
    }

    .contact-btn {
      display: block;
      width: 100%;
      padding: 17px;
      margin-top: 10px;
      background: #149e9a;
      color: white;
      text-align: center;
      text-decoration: none;
      border-radius: 18px;
      font-size: 19px;
      border: none;
      cursor: pointer;
    }

    .back-link {
      display: block;
      text-align: center;
      margin: 22px 0;
      color: #149e9a;
      text-decoration: none;
      font-size: 18px;
    }

    .message {
      background: white;
      padding: 30px;
      border-radius: 22px;
      text-align: center;
      font-size: 18px;
      line-height: 2;
    }

    .loading {
      padding: 40px 20px;
    }

    .error {
      color: #b32626;
    }

  </style>

</head>

<body>

  <div class="container">

    <div id="profile">

      <div class="message loading">
        ⏳ در حال دریافت اطلاعات داکتر...
      </div>

    </div>

    <a href="doctor-search.html" class="back-link">
      ← بازگشت به جستجوی داکتر
    </a>

  </div>


  <script>

    /* =====================================================
       اطلاعات Supabase
       ===================================================== */

    const SUPABASE_URL =
      "اینجا آدرس پروژه Supabase را قرار می‌دهیم";

    const SUPABASE_ANON_KEY =
      "اینجا کلید Anon پروژه را قرار می‌دهیم";


    /* =====================================================
       ساخت اتصال Supabase
       ===================================================== */

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    /* =====================================================
       گرفتن ID داکتر از آدرس
       ===================================================== */

    const urlParams =
      new URLSearchParams(window.location.search);

    const doctorId =
      urlParams.get("id");


    const profileBox =
      document.getElementById("profile");


    /* =====================================================
       نوع ویزیت
       ===================================================== */

    function createVisitTypes(value) {

      if (!value) {
        return "ثبت نشده";
      }

      let types = [];

      if (Array.isArray(value)) {

        types = value;

      } else {

        try {

          const parsed =
            JSON.parse(value);

          if (Array.isArray(parsed)) {

            types = parsed;

          } else {

            types =
              String(value)
                .split(",")
                .map(item => item.trim());

          }

        } catch {

          types =
            String(value)
              .split(",")
              .map(item => item.trim());

        }

      }

      if (types.length === 0) {
        return "ثبت نشده";
      }

      return types.map(type => `

        <span class="visit-type">
          ${type}
        </span>

      `).join("");

    }


    /* =====================================================
       ساعات کاری
       ===================================================== */

    function createWorkingHours(value) {

      if (!value) {

        return `
          <div class="day">
            ساعات کاری ثبت نشده است.
          </div>
        `;

      }

      return `
        <div class="day">
          ${String(value).replace(/\n/g, "<br>")}
        </div>
      `;

    }


    /* =====================================================
       نمایش پروفایل داکتر
       ===================================================== */

    function showDoctor(doctor) {

      const price =
        doctor.visit_price !== null &&
        doctor.visit_price !== undefined &&
        doctor.visit_price !== ""
          ? doctor.visit_price + " افغانی"
          : "ثبت نشده";


      const visitTypes =
        createVisitTypes(
          doctor.visit_types
        );


      const workingHours =
        createWorkingHours(
          doctor.working_hours
        );


      profileBox.innerHTML = `

        <!-- سرصفحه -->

        <div class="header">

          <div class="doctor-icon">
            👨‍⚕️
          </div>

          <div class="doctor-name">
            ${doctor.doctor_name || "نام ثبت نشده"}
          </div>

          <div class="specialty">
            ${doctor.specialty || "تخصص ثبت نشده"}
          </div>

        </div>


        <!-- اطلاعات داکتر -->

        <div class="card">

          <div class="card-title">
            👨‍⚕️ اطلاعات داکتر
          </div>

          <div class="info-row">
            <span class="label">
              📍 شهر:
            </span>

            ${doctor.city || "ثبت نشده"}
          </div>

          <div class="info-row">
            <span class="label">
              📍 آدرس مطب:
            </span>

            ${doctor.address || "ثبت نشده"}
          </div>

          <div class="info-row">
            <span class="label">
              📞 شماره تماس:
            </span>

            ${doctor.phone || "ثبت نشده"}
          </div>

        </div>


        <!-- نوبت‌دهی -->

        <div class="card">

          <div class="card-title">
            📅 نوبت‌دهی
          </div>

          <a
            href="appointment.html?id=${doctor.id}"
            class="contact-btn"
          >
            📅 گرفتن نوبت
          </a>

        </div>


        <!-- ساعات کاری -->

        <div class="card">

          <div class="card-title">
            🕐 ساعات کاری
          </div>

          ${workingHours}

        </div>


        <!-- اطلاعات ویزیت -->

        <div class="card">

          <div class="card-title">
            💰 اطلاعات ویزیت
          </div>

          <div class="info-row">

            <span class="label">
              قیمت ویزیت:
            </span>

            ${price}

          </div>

          <div class="info-row">

            <span class="label">
              نوع ویزیت:
            </span>

            <br>

            ${visitTypes}

          </div>

        </div>


        <!-- معرفی داکتر -->

        <div class="card">

          <div class="card-title">
            👨‍⚕️ معرفی داکتر
          </div>

          <div class="info-row">
            ${doctor.about || "معرفی داکتر ثبت نشده است."}
          </div>

        </div>


        <!-- خدمات پزشکی -->

        <div class="card">

          <div class="card-title">
            🩺 خدمات پزشکی
          </div>

          <div class="info-row">
            ${doctor.services || "خدمات ثبت نشده است."}
          </div>

        </div>


        <!-- تماس -->

        <div class="card">

          <div class="card-title">
            📞 تماس با داکتر
          </div>

          <a
            href="tel:${doctor.phone || ""}"
            class="contact-btn"
          >
            📞 تماس با داکتر
          </a>

        </div>

      `;

    }


    /* =====================================================
       دریافت اطلاعات داکتر از جدول Doctors
       ===================================================== */

    async function loadDoctor() {

      try {

        let query =
          supabaseClient
            .from("Doctors")
            .select("*");


        /* اگر ID داکتر در آدرس وجود داشت */

        if (doctorId) {

          query =
            query
              .eq("id", doctorId)
              .single();

        } else {

          /* آخرین داکتر ثبت شده */

          query =
            query
              .order("created_at", {
                ascending: false
              })
              .limit(1)
              .maybeSingle();

        }


        const {
          data,
          error
        } = await query;


        /* خطای Supabase */

        if (error) {

          console.error(error);

          profileBox.innerHTML = `

            <div class="message error">

              ❌ دریافت اطلاعات داکتر موفق نشد.

              <br><br>

              جدول <b>Doctors</b>
              را بررسی کنید.

            </div>

          `;

          return;

        }


        /* هیچ داکتری پیدا نشد */

        if (!data) {

          profileBox.innerHTML = `

            <div class="message">

              هنوز اطلاعات داکتری ثبت نشده است.

              <br><br>

              ابتدا مشخصات داکتر را ثبت کنید.

            </div>

          `;

          return;

        }


        /* نمایش داکتر */

        showDoctor(data);


      } catch (error) {

        console.error(error);

        profileBox.innerHTML = `

          <div class="message error">

            ❌ خطایی هنگام دریافت اطلاعات رخ داد.

            <br><br>

            دوباره تلاش کنید.

          </div>

        `;

      }

    }


    /* =====================================================
       شروع برنامه
       ===================================================== */

    loadDoctor();

  </script>

</body>

</html>
