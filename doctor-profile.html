<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>مشخصات داکتر - داکتر یار</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f3f8fa;
      color: #222;
    }

    .container {
      max-width: 700px;
      margin: 30px auto;
      padding: 15px;
    }

    .card {
      background: white;
      border-radius: 25px;
      padding: 25px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    }

    .title {
      text-align: center;
      color: #119e98;
      font-size: 28px;
      margin-bottom: 25px;
    }

    .doctor-icon {
      text-align: center;
      font-size: 65px;
      margin-bottom: 10px;
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
      color: #555;
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      font-family: inherit;
      background: #fafafa;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .save-btn {
      width: 100%;
      border: none;
      background: #119e98;
      color: white;
      padding: 16px;
      border-radius: 14px;
      font-size: 18px;
      font-family: inherit;
      cursor: pointer;
      margin-top: 10px;
    }

    .save-btn:hover {
      background: #0c8580;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #119e98;
      text-decoration: none;
      font-size: 16px;
    }

    .message {
      display: none;
      text-align: center;
      margin-top: 15px;
      color: #119e98;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <div class="doctor-icon">👨‍⚕️</div>

      <h1 class="title">مشخصات داکتر</h1>

      <div class="field">
        <label>نام داکتر</label>
        <input type="text" placeholder="نام و تخلص داکتر">
      </div>

      <div class="field">
        <label>تخصص</label>
        <input type="text" placeholder="مثلاً متخصص قلب">
      </div>

      <div class="field">
        <label>شماره تماس</label>
        <input type="tel" placeholder="شماره تماس">
      </div>

      <div class="field">
        <label>آدرس مطب</label>
        <input type="text" placeholder="آدرس مطب یا شفاخانه">
      </div>

      <div class="field">
        <label>ساعات کاری</label>
        <input type="text" placeholder="مثلاً شنبه تا پنجشنبه، ۸ صبح تا ۴ عصر">
      </div>

      <div class="field">
        <label>شماره جواز پزشکی</label>
        <input type="text" placeholder="شماره جواز">
      </div>

      <div class="field">
        <label>معرفی داکتر</label>
        <textarea placeholder="توضیحات درباره داکتر، تجربه و خدمات..."></textarea>
      </div>

      <div class="field">
        <label>خدمات پزشکی</label>
        <textarea placeholder="خدماتی که داکتر ارائه می‌کند..."></textarea>
      </div>

      <button class="save-btn" onclick="saveProfile()">
        ذخیره مشخصات
      </button>

      <div class="message" id="message">
        ✅ مشخصات با موفقیت ذخیره شد
      </div>

      <a class="back" href="index.html">
        ← بازگشت به صفحه اصلی
      </a>

    </div>

  </div>

  <script>
    function saveProfile() {
      document.getElementById("message").style.display = "block";
    }
  </script>
<div class="documents-section">

  <h2>📄 اسناد داکتر</h2>

  <div class="document-card">
    <h3>جواز طبابت</h3>
    <input type="text" placeholder="شماره جواز یا لینک سند">
  </div>

  <div class="document-card">
    <h3>مدرک تحصیلی</h3>
    <input type="text" placeholder="مشخصات یا لینک مدرک">
  </div>

  <div class="document-card">
    <h3>کارت هویت</h3>
    <input type="text" placeholder="مشخصات سند">
  </div>

  <button class="save-btn" type="button">
    ذخیره اسناد
  </button>

</div>
</body>
</html>
