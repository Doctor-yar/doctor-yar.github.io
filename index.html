<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دکتر یار</title>

  <style>
    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f5f8fa;
      color: #222;
    }

    header {
      background: #0b8f87;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      margin: 8px 0 0;
    }

    .container {
      max-width: 900px;
      margin: 30px auto;
      padding: 20px;
    }

    .welcome {
      background: white;
      padding: 30px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 3px 15px #ddd;
    }

    .welcome h2 {
      color: #0b8f87;
    }

    .buttons {
      margin-top: 25px;
    }

    button {
      background: #0b8f87;
      color: white;
      border: none;
      padding: 14px 25px;
      margin: 5px;
      border-radius: 10px;
      font-size: 16px;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #777;
    }
  </style>
</head>

<body>

  <header>
    <h1>دکتر یار</h1>
    <p>پلتفرم خدمات صحی و پزشکی</p>
  </header>

  <div class="container">

    <div class="welcome">
      <h2>به دکتر یار خوش آمدید</h2>

      <p>
        دکتر یار یک پلتفرم برای ارتباط آسان میان بیماران،
        داکتران و خدمات صحی است.
      </p>

      <div class="buttons">
        <button>جستجوی داکتر</button>
        <button>ورود داکتر</button>
        <button>ورود بیمار</button>
      </div>
    </div>

  </div>

  <footer>
    © 2026 دکتر یار - تمامی حقوق محفوظ است
  </footer>

</body>
</html>
