<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ورود داکتر | داکتر یار</title>

<style>

body{
  margin:0;
  font-family:Tahoma,Arial,sans-serif;
  background:#f5f8fa;
}

.box{
  width:90%;
  max-width:550px;
  margin:60px auto;
  background:white;
  padding:30px;
  border-radius:25px;
  box-shadow:0 5px 25px rgba(0,0,0,.08);
  text-align:center;
}

h1{
  color:#129b94;
}

input{
  width:100%;
  padding:16px;
  margin:10px 0;
  border:2px solid #ddd;
  border-radius:15px;
  font-size:18px;
  box-sizing:border-box;
}

button{
  width:100%;
  padding:16px;
  margin-top:15px;
  border:0;
  border-radius:15px;
  background:#129b94;
  color:white;
  font-size:18px;
}

.register{
  display:block;
  margin-top:18px;
  padding:15px;
  background:#e9f8f7;
  color:#129b94;
  border-radius:15px;
  text-decoration:none;
}

#error{
  color:red;
  margin-top:15px;
  display:none;
}

</style>

</head>

<body>

<div class="box">

<h1>🩺 ورود داکتر</h1>

<p>
برای ورود شماره تماس و رمز چهار رقمی خود را وارد کنید.
</p>

<input
type="tel"
id="phone"
placeholder="شماره تماس"
>

<input
type="password"
id="pin"
maxlength="4"
inputmode="numeric"
placeholder="رمز چهار رقمی"
>

<button onclick="login()">
🔓 ورود به پنل داکتر
</button>

<div id="error"></div>

<a
href="doctor-register.html"
class="register"
>
👨‍⚕️ ثبت نام داکتر
</a>

</div>


<script>

function login(){

const phone =
document.getElementById("phone").value.trim();

const pin =
document.getElementById("pin").value.trim();

const saved =
localStorage.getItem("doctorProfile");

const error =
document.getElementById("error");


if(!saved){

error.innerHTML =
"❌ هنوز داکتری ثبت نام نکرده است.";

error.style.display="block";

return;

}


let doctor;

try{

doctor=JSON.parse(saved);

}catch(e){

error.innerHTML =
"❌ اطلاعات داکتر خراب است.";

error.style.display="block";

return;

}


if(
phone === doctor.phone &&
pin === doctor.doctorPin
){

localStorage.setItem(
"doctorLoggedIn",
"true"
);

window.location.href =
"doctor-profile.html";

}else{

error.innerHTML =
"❌ شماره تماس یا رمز چهار رقمی اشتباه است.";

error.style.display="block";

}

}

</script>

</body>

</html>
