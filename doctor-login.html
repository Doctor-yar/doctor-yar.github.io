<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ورود داکتر | داکتر یار</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Tahoma,Arial,sans-serif;
  background:#f5f8fa;
  color:#333;
}

.box{
  width:90%;
  max-width:550px;
  margin:60px auto;
  background:white;
  padding:30px;
  border-radius:25px;
  box-shadow:0 5px 25px rgba(0,0,0,.08);
  text-align:center;
}

h1{
  color:#129b94;
  margin-top:0;
}

p{
  line-height:1.9;
  color:#666;
}

input{
  width:100%;
  padding:16px;
  margin:10px 0;
  border:2px solid #ddd;
  border-radius:15px;
  font-size:18px;
  font-family:Tahoma,Arial,sans-serif;
  outline:none;
}

input:focus{
  border-color:#129b94;
}

#pin{
  text-align:center;
  letter-spacing:8px;
  font-size:24px;
}

button{
  width:100%;
  padding:16px;
  margin-top:15px;
  border:0;
  border-radius:15px;
  background:#129b94;
  color:white;
  font-size:18px;
  font-family:Tahoma,Arial,sans-serif;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
}

.message{
  display:none;
  margin-top:18px;
  padding:16px;
  border-radius:15px;
  line-height:2;
}

.error{
  display:block;
  background:#fff0f0;
  color:#b32626;
}

.pending{
  display:block;
  background:#fff9e8;
  color:#765d13;
}

.rejected{
  display:block;
  background:#fff0f0;
  color:#b32626;
}

.success{
  display:block;
  background:#e8f8f7;
  color:#08756f;
}

.register{
  display:block;
  margin-top:18px;
  padding:15px;
  background:#e9f8f7;
  color:#129b94;
  border-radius:15px;
  text-decoration:none;
}

.home{
  display:block;
  margin-top:12px;
  color:#129b94;
  text-decoration:none;
}

</style>

</head>

<body>

<div class="box">

<h1>🩺 ورود داکتر</h1>

<p>
پس از تأیید مدیریت، شماره تماس و کد چهار رقمی خود را وارد کنید.
</p>

<input
  type="tel"
  id="phone"
  placeholder="شماره تماس"
  autocomplete="tel"
>

<input
  type="password"
  id="pin"
  maxlength="4"
  inputmode="numeric"
  pattern="[0-9]{4}"
  placeholder="••••"
  autocomplete="current-password"
>

<button
  id="loginButton"
  onclick="login()"
>
🔓 ورود به پنل داکتر
</button>

<div
  id="message"
  class="message"
></div>

<a
  href="doctor-register.html"
  class="register"
>
👨‍⚕️ ثبت نام داکتر
</a>

<a
  href="index.html"
  class="home"
>
← بازگشت به صفحه اصلی
</a>

</div>


<script>

/* =========================
   Supabase
========================= */

const SUPABASE_URL =
  "https://dzuilchtsnxncooixaib.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_gzKmKTsngGOlaoYSCiQB9w_VKSQj_H5";


/* =========================
   ورود داکتر
========================= */

async function login(){

  const phone =
    document.getElementById(
      "phone"
    ).value.trim();

  const pin =
    document.getElementById(
      "pin"
    ).value.trim();

  const message =
    document.getElementById(
      "message"
    );

  const button =
    document.getElementById(
      "loginButton"
    );


  message.className =
    "message";

  message.innerHTML =
    "";


  /* شماره */

  if(!phone){

    showMessage(
      "error",
      "لطفاً شماره تماس خود را وارد کنید."
    );

    return;

  }


  /* کد */

  if(!/^\d{4}$/.test(pin)){

    showMessage(
      "error",
      "کد ورود باید دقیقاً ۴ رقم باشد."
    );

    return;

  }


  button.disabled = true;

  button.innerHTML =
    "⏳ در حال بررسی...";


  try{

    const response =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/rpc/doctor_login",

        {

          method:"POST",

          headers:{

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_KEY,

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({

              p_phone:
                phone,

              p_pin:
                pin

            })

        }

      );


    let result = null;


    try{

      result =
        await response.json();

    }catch(e){

      result = null;

    }


    console.log(
      "Login result:",
      result
    );


    if(!response.ok){

      throw new Error(
        result?.message ||
        "خطا در ارتباط با دیتابیس."
      );

    }


    /* =========================
       در انتظار تأیید
    ========================= */

    if(
      result.status ===
      "pending"
    ){

      showMessage(
        "pending",
        `
        ⏳ ثبت‌نام شما هنوز تأیید نشده است.
        <br>
        لطفاً منتظر بررسی مدیریت داکتر یار باشید.
        `
      );

      button.disabled = false;

      button.innerHTML =
        "🔓 ورود به پنل داکتر";

      return;

    }


    /* =========================
       رد شده
    ========================= */

    if(
      result.status ===
      "rejected"
    ){

      let reason = "";

      if(result.reason){

        reason = `
          <br><br>
          <strong>دلیل رد:</strong>
          <br>
          ${escapeHtml(
            result.reason
          )}
        `;

      }


      showMessage(
        "rejected",
        `
        ❌ ثبت‌نام شما توسط مدیریت رد شده است.
        ${reason}
        `
      );

      button.disabled = false;

      button.innerHTML =
        "🔓 ورود به پنل داکتر";

      return;

    }


    /* =========================
       ورود موفق
    ========================= */

    if(
      result.success === true &&
      result.status ===
      "approved"
    ){

      localStorage.setItem(
        "doctorProfile",
        JSON.stringify(
          result.doctor
        )
      );


      localStorage.setItem(
        "doctorLoggedIn",
        "true"
      );


      showMessage(
        "success",
        `
        ✅ ورود موفق بود.
        <br>
        در حال ورود به پروفایل شما...
        `
      );


      setTimeout(function(){

        window.location.href =
          "doctor-profile.html";

      },1000);


      return;

    }


    /* =========================
       خطای عمومی
    ========================= */

    showMessage(
      "error",
      result.message ||
      "ورود انجام نشد."
    );


    button.disabled = false;

    button.innerHTML =
      "🔓 ورود به پنل داکتر";


  }catch(error){

    console.error(
      "Login Error:",
      error
    );


    showMessage(
      "error",
      error.message ||
      "ارتباط با سرور برقرار نشد."
    );


    button.disabled = false;

    button.innerHTML =
      "🔓 ورود به پنل داکتر";

  }

}


/* =========================
   نمایش پیام
========================= */

function showMessage(
  type,
  text
){

  const message =
    document.getElementById(
      "message"
    );


  message.className =
    "message " +
    type;

  message.innerHTML =
    text;


  message.scrollIntoView({

    behavior:"smooth",

    block:"center"

  });

}


/* =========================
   جلوگیری از HTML خطرناک
========================= */

function escapeHtml(text){

  return String(text)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================
   ورود با Enter
========================= */

document
  .getElementById("pin")
  .addEventListener(
    "keydown",
    function(event){

      if(
        event.key ===
        "Enter"
      ){

        login();

      }

    }
  );

</script>

</body>

</html>
