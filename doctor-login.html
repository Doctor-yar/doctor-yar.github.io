<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ورود داکتر - داکتر یار</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Tahoma, Arial, sans-serif;
  background:#f5f8fa;
  color:#222;
}

.login-box{
  width:90%;
  max-width:600px;
  margin:80px auto;
  background:white;
  padding:45px 30px;
  border-radius:35px;
  box-shadow:0 10px 35px rgba(0,0,0,.08);
  text-align:center;
}

h1{
  color:#129b94;
  font-size:42px;
  margin-bottom:20px;
}

.subtitle{
  color:#777;
  font-size:22px;
  margin-bottom:45px;
}

input{
  width:100%;
  padding:20px;
  margin:12px 0;
  border:2px solid #ddd;
  border-radius:22px;
  font-size:20px;
  text-align:right;
  outline:none;
}

input:focus{
  border-color:#129b94;
}

button{
  width:100%;
  padding:20px;
  margin-top:25px;
  border:0;
  border-radius:22px;
  background:#129b94;
  color:white;
  font-size:22px;
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

#error{
  color:red;
  font-size:20px;
  margin-top:20px;
  display:none;
}

.back{
  display:block;
  margin-top:30px;
  color:#129b94;
  text-decoration:none;
  font-size:19px;
}
</style>
</head>

<body>

<div class="login-box">

<h1>🩺 ورود داکتر</h1>

<div class="subtitle">
به پنل داکتر یار خوش آمدید
</div>

<input
  type="text"
  id="username"
  placeholder="نام کاربری"
>

<input
  type="password"
  id="password"
  placeholder="رمز عبور"
>

<button onclick="login()">
ورود به پنل
</button>

<div id="error">
❌ نام کاربری یا رمز عبور اشتباه است
</div>

<a class="back" href="index.html">
← بازگشت به صفحه اصلی
</a>

</div>

<script>


function login() {

  let username = document.getElementById("username").value.trim();
  let password = document.getElementById("password").value.trim();

  if (
    username.toLowerCase() === "doctor" &&
    password === "1234"
  ) {

    window.location.href = "doctor-profile.html";

  } else {

    document.getElementById("error").style.display = "block";

  }
}
</script>


</body>
</html>
