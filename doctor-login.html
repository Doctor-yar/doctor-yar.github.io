<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود داکتر - داکتر یار</title>

  <style>
    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f5f8fa;
      color: #222;
    }

    .container {
      max-width: 500px;
      margin: 60px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 35px 25px;
      border-radius: 25px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
      text-align: center;
    }

    h1 {
      color: #0b8f87;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 30px;
    }

    input {
      width: 90%;
      padding: 16px;
      margin: 10px 0;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      text-align: right;
    }

    button {
      width: 95%;
      padding: 16px;
      margin-top: 20px;
      border: none;
      border-radius: 12px;
      background: #0b968e;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    button:hover {
      background: #087d76;
    }

    .message {
      margin-top: 20px;
      font-size: 16px;
      font-weight: bold;
    }

    .back {
      display: block;
      margin-top: 25px;
      color: #0b8f87;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="card">

      <h1>🩺 ورود داکتر</h1>

      <p class="subtitle">
        به پنل داکتر یار خوش آمدید
      </p>

      <input
        type="text"
        id="username"
        placeholder="نام کاربری"
      >

      <input
        type="password"
        id="password"
        placeholder="رمز عبور"
      >

      <button onclick="login()">
        ورود به پنل
      </button>

      <div id="message" class="message"></div>

      <a class="back" href="index.html">
        ← بازگشت به صفحه اصلی
      </a>

    </div>
  </div>

  <script>
    function login() {

      const username =
        document.getElementById("username").value;

      const password =
        document.getElementById("password").value;

      const message =
        document.getElementById("message");

      if (username === "doctor" && password === "1234") {

        message.style.color = "green";
        message.innerHTML =
          "ورود موفق بود ✅";

        setTimeout(function() {
          window.location.href = "doctor-panel.html";
        }, 1000);

      } else {

        message.style.color = "red";
        message.innerHTML =
          "نام کاربری یا رمز عبور اشتباه است ❌";

      }
    }
  </script>

</body>
</html>
