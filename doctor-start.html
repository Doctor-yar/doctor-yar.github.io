<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>داکتر یار | بخش داکتران</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f3f8fa;
      color: #263238;
    }

    .container {
      width: 92%;
      max-width: 650px;
      margin: 45px auto;
    }

    .card {
      background: white;
      border-radius: 25px;
      padding: 35px 25px;
      text-align: center;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
    }

    .logo {
      font-size: 65px;
      margin-bottom: 5px;
    }

    h1 {
      margin: 5px 0 10px;
      color: #119e98;
      font-size: 32px;
    }

    .subtitle {
      color: #607d8b;
      font-size: 16px;
      line-height: 2;
      margin-bottom: 30px;
    }

    .option {
      border: 1px solid #e0e7ea;
      border-radius: 18px;
      padding: 22px 18px;
      margin-top: 18px;
      background: #ffffff;
    }

    .option-icon {
      font-size: 42px;
      margin-bottom: 8px;
    }

    .option h2 {
      margin: 8px 0;
      color: #263238;
      font-size: 20px;
    }

    .option p {
      color: #607d8b;
      font-size: 13px;
      line-height: 1.9;
      margin: 8px 0 18px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      border-radius: 11px;
      text-decoration: none;
      font-family: Tahoma, Arial, sans-serif;
      font-size: 16px;
      font-weight: bold;
      border: none;
    }

    .register {
      background: #119e98;
      color: white;
    }

    .register:hover {
      background: #0f857f;
    }

    .login {
      background: #e0f2fe;
      color: #0369a1;
    }

    .login:hover {
      background: #bae6fd;
    }

    .home {
      display: block;
      margin-top: 25px;
      color: #607d8b;
      text-decoration: none;
      font-size: 14px;
    }

    .home:hover {
      color: #119e98;
    }

    @media (max-width: 500px) {
      .container {
        margin: 25px auto;
      }

      .card {
        padding: 28px 18px;
      }

      h1 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <div class="logo">🩺</div>

      <h1>داکتر یار</h1>

      <div class="subtitle">
        بخش مخصوص داکتران
        <br>
        برای ثبت‌نام یا ورود به پنل داکتر
      </div>


      <!-- ثبت نام -->

      <div class="option">

        <div class="option-icon">📝</div>

        <h2>ثبت‌نام داکتر</h2>

        <p>
          اگر هنوز در داکتر یار حساب ندارید،
          ابتدا مشخصات خود را ثبت کنید.
        </p>

        <a
          href="doctor-profile.html"
          class="btn register"
        >
          ثبت‌نام داکتر
        </a>

      </div>


      <!-- ورود -->

      <div class="option">

        <div class="option-icon">🔐</div>

        <h2>ورود داکتر</h2>

        <p>
          اگر قبلاً ثبت‌نام کرده‌اید،
          با رمز چهار رقمی خود وارد پنل شوید.
        </p>

        <a
          href="doctor-login.html"
          class="btn login"
        >
          ورود داکتر
        </a>

      </div>


      <!-- برگشت -->

      <a
        href="index.html"
        class="home"
      >
        ← بازگشت به صفحه اصلی
      </a>

    </div>

  </div>

</body>

</html>
